<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="https://annword.ru/" />
    <title>Страница не найдена — AnnWord</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2ff; color: #1e1b4b; }
      main { width: min(36rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; border-radius: 1.5rem; background: white; text-align: center; box-shadow: 0 20px 60px rgba(30,27,75,.12); }
      h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 8vw, 3rem); }
      p { margin: 0 auto 1.5rem; max-width: 28rem; color: #475569; line-height: 1.6; }
      a { display: inline-block; border-radius: 1rem; padding: .85rem 1.25rem; background: #4f46e5; color: white; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Страница не найдена</h1>
      <p>Такой страницы в AnnWord нет. Вернитесь на главную и продолжите учить английские слова играючи.</p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
