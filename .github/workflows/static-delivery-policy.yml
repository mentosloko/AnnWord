name: Static Delivery Policy

on:
  workflow_run:
    workflows:
      - Deploy to Yandex Cloud
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: annword-static-delivery-policy
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  verify-static-delivery:
    name: Cache and encoding verification
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mark static delivery pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"Static Delivery Policy",description:"Applying and verifying frontend cache policy",target_url:process.env.TARGET_URL}))' > /tmp/static-status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            --data-binary @/tmp/static-status.json

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build exact production frontend
        env:
          VITE_API_URL: ${{ secrets.YC_API_PUBLIC_URL }}
        run: |
          npm run build
          printf '{"sha":"%s","builtAt":"%s"}\n' "$SOURCE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/release.json

      - name: Install AWS CLI
        run: python -m pip install --user --upgrade awscli

      - name: Apply Object Storage cache metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_FRONTEND_BUCKET: ${{ secrets.S3_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          python -m awscli --endpoint-url "$S3_ENDPOINT" s3 sync dist "s3://${S3_FRONTEND_BUCKET}" \
            --delete \
            --exclude '.well-known/acme-challenge/*' \
            --exclude 'assets/*' \
            --cache-control 'public,max-age=300,must-revalidate'
          python -m awscli --endpoint-url "$S3_ENDPOINT" s3 sync dist/assets "s3://${S3_FRONTEND_BUCKET}/assets" \
            --delete \
            --cache-control 'public,max-age=31536000,immutable'
          python -m awscli --endpoint-url "$S3_ENDPOINT" s3 cp dist/index.html "s3://${S3_FRONTEND_BUCKET}/index.html" \
            --cache-control 'no-cache,max-age=0,must-revalidate' \
            --content-type 'text/html; charset=utf-8'
          python -m awscli --endpoint-url "$S3_ENDPOINT" s3 cp dist/release.json "s3://${S3_FRONTEND_BUCKET}/release.json" \
            --cache-control 'no-cache,max-age=0,must-revalidate' \
            --content-type 'application/json; charset=utf-8'

      - name: Verify live cache headers and measure encoding
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          APP_BASE="${APP_URL%/}"
          for attempt in $(seq 1 18); do
            BODY="$(curl -fsS "${APP_BASE}/release.json?static=${SOURCE_SHA}" || true)"
            if printf '%s' "$BODY" | grep -Fq "$SOURCE_SHA"; then break; fi
            if [ "$attempt" -eq 18 ]; then
              echo "release.json did not expose $SOURCE_SHA in time"
              exit 1
            fi
            sleep 5
          done

          curl -fsSI "${APP_BASE}/" > /tmp/html-headers.txt
          INDEX="$(curl -fsS "${APP_BASE}/")"
          ASSET_PATH="$(printf '%s' "$INDEX" | grep -oE '/assets/[^"[:space:]]+\.(js|css)' | head -n 1)"
          test -n "$ASSET_PATH"
          curl -fsSI "${APP_BASE}${ASSET_PATH}" > /tmp/asset-headers.txt

          echo '--- HTML headers ---'
          cat /tmp/html-headers.txt
          echo '--- Asset headers ---'
          cat /tmp/asset-headers.txt
          grep -Eqi '^cache-control:.*(no-cache|max-age=0).*must-revalidate' /tmp/html-headers.txt
          grep -Eqi '^cache-control:.*max-age=31536000.*immutable' /tmp/asset-headers.txt

          curl -fsS -H 'Accept-Encoding: br,gzip' -D /tmp/encoding-headers.txt -o /tmp/asset-wire.bin "${APP_BASE}${ASSET_PATH}"
          curl -fsS -H 'Accept-Encoding: identity' -o /tmp/asset-identity.bin "${APP_BASE}${ASSET_PATH}"
          ENCODING="$(awk 'BEGIN{IGNORECASE=1} /^content-encoding:/{gsub("\r",""); print $2}' /tmp/encoding-headers.txt | tail -n 1)"
          WIRE_BYTES="$(wc -c < /tmp/asset-wire.bin | tr -d ' ')"
          IDENTITY_BYTES="$(wc -c < /tmp/asset-identity.bin | tr -d ' ')"
          echo "Static asset: $ASSET_PATH"
          echo "Content-Encoding: ${ENCODING:-identity}"
          echo "Wire bytes with br,gzip accepted: $WIRE_BYTES"
          echo "Identity bytes: $IDENTITY_BYTES"
          {
            echo '### Static delivery verification'
            echo "- Commit: $SOURCE_SHA"
            echo "- Asset: $ASSET_PATH"
            echo '- Hashed asset cache: public, max-age=31536000, immutable'
            echo '- HTML cache: no-cache, max-age=0, must-revalidate'
            echo "- Content-Encoding: ${ENCODING:-identity}"
            echo "- Transfer bytes (br,gzip accepted): $WIRE_BYTES"
            echo "- Identity bytes: $IDENTITY_BYTES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish static delivery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            STATE=success
            DESCRIPTION='Frontend cache policy applied and verified'
          else
            STATE=failure
            DESCRIPTION='Frontend cache policy application or verification failed'
          fi
          export STATE DESCRIPTION
          node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"Static Delivery Policy",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))' > /tmp/static-status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            --data-binary @/tmp/static-status.json
          test "$STATE" = success
