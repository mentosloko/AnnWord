name: Finalize Spotlight Premium

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-spotlight-premium.trigger

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: finalize-spotlight-premium
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Mark Spotlight finalization pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"Spotlight Finalization",description:"Verifying Spotlight Premium branch",target_url:process.env.TARGET_URL}))' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json

      - uses: actions/checkout@v4
        with:
          ref: feature/spotlight-premium
          fetch-depth: 0

      - name: Apply Spotlight integration when needed
        id: apply
        run: |
          set -euo pipefail
          if [ -f services/spotlightDictionaryCatalog.ts ]; then
            echo "Spotlight sources already exist; using current branch state."
            exit 0
          fi
          for file in \
            scripts/spotlight-upload/runtime_00a.b64 \
            scripts/spotlight-upload/runtime_00b.b64 \
            scripts/spotlight-upload/runtime_00c.b64 \
            scripts/spotlight-upload/runtime_00d.b64 \
            scripts/spotlight-upload/runtime_03.b64 \
            scripts/spotlight-upload/runtime_04.b64 \
            scripts/spotlight-upload/runtime_05.b64 \
            scripts/spotlight-upload/runtime_06.b64 \
            scripts/spotlight-upload/runtime_07.b64 \
            scripts/spotlight-upload/runtime_08.b64; do
            tr -cd 'A-Za-z0-9+/=' < "$file"
          done | base64 -d > /tmp/spotlight-runtime.tar.xz
          test "$(wc -c < /tmp/spotlight-runtime.tar.xz)" -gt 90000
          xz -t /tmp/spotlight-runtime.tar.xz
          mkdir -p dictionaries/premium/spotlight
          tar -xJf /tmp/spotlight-runtime.tar.xz -C dictionaries/premium/spotlight
          tr -cd 'A-Za-z0-9+/=' < scripts/spotlight-upload/apply.py.xz.b64 | base64 -d | xz -d > /tmp/apply-spotlight.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-spotlight.py')
          source = path.read_text(encoding='utf-8')
          start = source.index("bundle_path = ROOT / 'scripts/spotlight-runtime.zip.b64'")
          end = source.index("\n\nwrite('services/premiumDictionaryCatalog.ts'", start)
          path.write_text(source[:start] + source[end + 2:], encoding='utf-8')
          PY
          python3 /tmp/apply-spotlight.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Spotlight integration
        run: |
          npm run lint
          npm run premium-dictionaries:validate
          npm run check:unit
          npm run build

      - name: Commit clean verified branch
        run: |
          rm -rf \
            scripts/spotlight-upload \
            scripts/spotlight-integration.trigger \
            .github/workflows/apply-spotlight-premium.yml \
            spotlight-integration-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Spotlight premium dictionaries"
            git push origin HEAD:feature/spotlight-premium
          fi

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING="$(gh pr list --head feature/spotlight-premium --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --head feature/spotlight-premium \
              --base main \
              --title "Add Spotlight premium dictionaries" \
              --body $'## Что добавлено\n- Premium-семейство Spotlight для 2–11 классов\n- выбор всего класса, основного модуля или дополнительного раздела\n- поддержка Practice и Kids\n- сохранение выбранного класса и раздела\n- динамическая загрузка данных по классу\n\n## Проверки\n- TypeScript\n- Premium dictionary validation\n- unit tests\n- production build\n\nСхема базы данных не изменяется.'
          else
            echo "Pull request #$EXISTING already exists."
          fi

      - name: Publish Spotlight finalization status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; DESCRIPTION="Spotlight Premium verified and PR opened"; else STATE=failure; DESCRIPTION="Spotlight Premium finalization failed"; fi
          STATE="$STATE" DESCRIPTION="$DESCRIPTION" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"Spotlight Finalization",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json
          test "$STATE" = success
