name: Extract Spotlight integration patch

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-spotlight-premium.trigger

permissions:
  contents: write
  statuses: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spotlight-premium
          fetch-depth: 0

      - name: Decode integration script
        run: |
          set -euo pipefail
          tr -cd 'A-Za-z0-9+/=' < scripts/spotlight-upload/apply.py.xz.b64 | base64 -d | xz -d > spotlight-apply-decoded.py
          python3 -m py_compile spotlight-apply-decoded.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add spotlight-apply-decoded.py
          git commit -m "Expose Spotlight integration patch for recovery"
          git push origin HEAD:feature/spotlight-premium
