name: Landing visual polish one-shot

on:
  push:
    branches:
      - agent/landing-visual-polish

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/landing-visual-polish
          fetch-depth: 0

      - name: Apply header cleanup and visual polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          header_path = Path('components/layout/AppHeader.tsx')
          header = header_path.read_text()

          header = replace_once(header, "isParent ? 'Kids' :", "isParent ? 'Семья' :", 'parent mode label')

          kids_badge_pattern = re.compile(r'\{guestParentLanding && <span className="hidden rounded-md bg-gradient-to-r from-violet-600 to-indigo-600 px-2 py-1 text-xs font-black lowercase text-white shadow-sm sm:inline-flex">kids</span>\}')
          header, count = kids_badge_pattern.subn('', header, count=1)
          if count != 1:
              raise SystemExit(f'kids badge: expected 1 occurrence, found {count}')

          tariffs = '<a href="/premium" className={navButton + \' text-indigo-950\'}>Тарифы</a>'
          if tariffs not in header:
              raise SystemExit('tariffs link not found')
          header = header.replace(tariffs, '', 1)

          header = replace_once(header, 'Создать кидс-профиль', 'Начать бесплатно', 'public CTA copy')

          old_guest_nav = '{guestParentLanding && <nav className="hidden items-center gap-1 lg:flex" aria-label="Навигация по AnnWord kids">'
          new_guest_nav = '{guestParentLanding && <nav className="hidden items-center gap-0.5 lg:flex" aria-label="Навигация по AnnWord">'
          header = replace_once(header, old_guest_nav, new_guest_nav, 'public nav identity')

          old_guest_cta = 'className="rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 px-4 py-2 text-sm font-black text-white shadow-lg shadow-indigo-600/20 transition hover:-translate-y-0.5 sm:px-5">Начать бесплатно</a>'
          new_guest_cta = 'className="rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 px-4 py-2 text-sm font-black text-white shadow-md shadow-indigo-600/15 transition hover:-translate-y-0.5 sm:px-5">Начать бесплатно</a>'
          header = replace_once(header, old_guest_cta, new_guest_cta, 'public CTA styling')

          header_path.write_text(header)

          landing_path = Path('components/screens/LandingMixScreen.tsx')
          landing = landing_path.read_text()

          paw_component = """\nconst PawMark: React.FC<{ className?: string }> = ({ className = '' }) => (\n  <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" className={`inline-block h-[0.9em] w-[0.9em] ${className}`} fill=\"currentColor\">\n    <ellipse cx=\"12\" cy=\"15.2\" rx=\"5.1\" ry=\"4.2\" />\n    <circle cx=\"6.2\" cy=\"10.2\" r=\"2.1\" />\n    <circle cx=\"10.1\" cy=\"6.8\" r=\"2.15\" />\n    <circle cx=\"14.4\" cy=\"6.8\" r=\"2.15\" />\n    <circle cx=\"18\" cy=\"10.3\" r=\"2.05\" />\n  </svg>\n);\n"""
          anchor = "const PET_SCENE = '/assets/pets/puppy/background.webp';\n"
          if 'const PawMark:' not in landing:
              landing = replace_once(landing, anchor, anchor + paw_component, 'paw component anchor')

          landing = replace_once(
              landing,
              'className="relative mx-auto min-h-[25rem] w-full max-w-[44rem] overflow-hidden rounded-[2.5rem] border-4 border-white/90 bg-gradient-to-br from-sky-100 via-violet-100 to-indigo-100 shadow-2xl shadow-indigo-900/15 sm:min-h-[30rem]"',
              'className="relative mx-auto min-h-[21rem] w-full max-w-[44rem] overflow-hidden rounded-[2rem] border border-white/80 bg-gradient-to-br from-sky-100 via-violet-100 to-indigo-100 shadow-xl shadow-indigo-900/10 sm:min-h-[24rem] lg:min-h-[25rem]"',
              'hero scene proportions'
          )

          landing = replace_once(
              landing,
              'className="absolute bottom-[-5%] left-[4%] z-10 w-[61%] max-w-[26rem] overflow-hidden rounded-[2rem] border-4 border-white/85 bg-white/70 shadow-2xl sm:left-[6%]"',
              'className="absolute bottom-[-8%] left-[2%] z-10 w-[58%] max-w-[22rem] overflow-hidden rounded-[1.8rem] bg-white/20 sm:left-[4%]"',
              'hero mascot framing'
          )

          landing = replace_once(
              landing,
              'className="overflow-hidden rounded-[1.75rem] border border-indigo-50 bg-white shadow-xl shadow-indigo-950/5 sm:rounded-[2.5rem]"',
              'className="overflow-hidden bg-white"',
              'outer landing frame'
          )

          landing = replace_once(
              landing,
              'px-4 pb-5 pt-6 sm:px-8 sm:pb-8 sm:pt-9 lg:px-10',
              'px-4 pb-4 pt-4 sm:px-7 sm:pb-6 sm:pt-6 lg:px-8',
              'hero section spacing'
          )

          landing = replace_once(
              landing,
              'grid gap-8 lg:grid-cols-[0.8fr_1.2fr] lg:items-center',
              'grid gap-5 lg:grid-cols-[0.78fr_1.22fr] lg:items-center',
              'hero grid density'
          )

          landing = replace_once(landing, 'relative z-20 mt-7 grid gap-1', 'relative z-20 mt-5 grid gap-1', 'trust strip spacing')

          landing = landing.replace('h-48 overflow-hidden bg-gradient-to-br from-violet-50 via-white to-sky-50 sm:h-52', 'h-44 overflow-hidden bg-gradient-to-br from-violet-50 via-white to-sky-50 sm:h-48')
          landing = landing.replace('h-52 overflow-hidden rounded-[1.65rem] bg-gradient-to-br from-violet-50 via-white to-blue-50 sm:h-56', 'h-48 overflow-hidden rounded-[1.5rem] bg-gradient-to-br from-violet-50 via-white to-blue-50 sm:h-52')

          landing = landing.replace('px-4 py-10 sm:px-8 sm:py-14 lg:px-10', 'px-4 py-8 sm:px-8 sm:py-10 lg:px-10')
          landing = landing.replace('px-4 pb-10 sm:px-8 sm:pb-14 lg:px-10', 'px-4 pb-8 sm:px-8 sm:pb-10 lg:px-10')

          landing = landing.replace('rounded-[1.8rem] border-2 border-white bg-white shadow-xl', 'rounded-[1.45rem] border-2 border-white bg-white shadow-lg')
          landing = landing.replace('className="h-[18.5rem] p-2"', 'className="h-[16rem] p-2"')

          mechanics_note = '<div className="mt-5 rounded-2xl border border-blue-100 bg-blue-50/80 px-4 py-3 text-center text-xs font-bold leading-relaxed text-blue-700">В «Виселице» ошибки снимают сердечки — без изображения повешения. В «Змейке» слово собирается только по соседним клеткам.</div>'
          if mechanics_note in landing:
              landing = landing.replace(mechanics_note, '', 1)

          landing = landing.replace('h-32 w-full object-contain drop-shadow-lg sm:h-40', 'h-28 w-full object-contain drop-shadow-lg sm:h-36')
          landing = landing.replace('h-16 w-16 object-contain sm:h-20 sm:w-20', 'h-14 w-14 object-contain sm:h-16 sm:w-16')
          landing = landing.replace('sm:min-h-[22rem]', 'sm:min-h-[20rem]')

          left_paw = '<span className="mr-2 text-violet-300" aria-hidden="true">🐾</span>'
          right_paw = '<span className="ml-2 text-violet-300" aria-hidden="true">🐾</span>'
          landing = landing.replace(left_paw, '<PawMark className="mr-2 text-violet-300" />')
          landing = landing.replace(right_paw, '<PawMark className="ml-2 text-violet-300" />')

          if 'Создать кидс-профиль' in landing or '>kids<' in landing or '>Тарифы<' in landing:
              raise SystemExit('forbidden public copy remains in landing')

          landing_path.write_text(landing)
          PY

      - name: Verify requested copy is gone
        shell: bash
        run: |
          ! grep -Rni --include='*.tsx' --include='*.ts' 'Создать кидс-профиль' components/layout components/screens
          ! grep -Rni --include='*.tsx' --include='*.ts' '>kids<' components/layout components/screens
          ! grep -n '>Тарифы<' components/layout/AppHeader.tsx
          grep -n 'Начать бесплатно' components/layout/AppHeader.tsx
          grep -n 'Режимы игры' components/layout/AppHeader.tsx

      - name: Commit result and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/landing-visual-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/layout/AppHeader.tsx components/screens/LandingMixScreen.tsx .github/workflows/landing-visual-polish.yml
          git commit -m "Polish landing proportions and simplify public identity"
          git push origin HEAD:agent/landing-visual-polish
