name: Apply Spotlight Premium

on:
  push:
    branches: [feature/spotlight-premium]
    paths:
      - scripts/spotlight-integration.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-spotlight-premium
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract Spotlight data and integration patch
        run: |
          set -euo pipefail
          cat scripts/spotlight-upload/runtime_*.b64 | base64 -d > /tmp/spotlight-runtime.tar.xz
          mkdir -p dictionaries/premium/spotlight
          tar -xJf /tmp/spotlight-runtime.tar.xz -C dictionaries/premium/spotlight

          base64 -d scripts/spotlight-upload/apply.py.xz.b64 | xz -d > /tmp/apply-spotlight.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-spotlight.py')
          source = path.read_text(encoding='utf-8')
          start = source.index("bundle_path = ROOT / 'scripts/spotlight-runtime.zip.b64'")
          end = source.index("\n\nwrite('services/premiumDictionaryCatalog.ts'", start)
          path.write_text(source[:start] + source[end + 2:], encoding='utf-8')
          PY
          python3 /tmp/apply-spotlight.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Spotlight integration
        run: |
          npm run lint
          npm run premium-dictionaries:validate
          npm run check:unit
          npm run build

      - name: Commit verified integration
        run: |
          rm -rf \
            scripts/spotlight-upload \
            scripts/spotlight-integration.trigger \
            .github/workflows/apply-spotlight-premium.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Spotlight premium dictionaries"
          git push
