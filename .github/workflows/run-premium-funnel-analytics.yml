name: Run Premium funnel analytics

on:
  push:
    branches: [main]
    paths:
      - 'scripts/run-premium-funnel-analytics.trigger'

permissions:
  contents: write
  statuses: write

concurrency:
  group: run-premium-funnel-analytics
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark analytics rollout pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"Premium Funnel Analytics\",\"description\":\"Applying and verifying analytics changes\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - name: Extract and run prepared patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/validate-legal-temp.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Patch Premium analytics and legal README'
          start = source.index(marker)
          run_line = source.index('        run: |', start)
          end = source.index('      - name: Setup Node.js', run_line)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[run_line + 1:end]) + '\n'
          Path('/tmp/apply-premium-analytics.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-premium-analytics.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify changes
        run: |
          npm run lint
          npm run test:unit
          npm run build

      - name: Commit application changes and clean temporary files
        run: |
          rm -f \
            .github/workflows/validate-legal-temp.yml \
            .github/workflows/run-premium-funnel-analytics.yml \
            legal-validation.txt \
            scripts/run-premium-funnel-analytics.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Track Premium purchase funnel"
          git push

      - name: Publish analytics rollout status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            STATE=success
            DESCRIPTION="Premium analytics verified and committed"
          else
            STATE=failure
            DESCRIPTION="Premium analytics rollout failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"Premium Funnel Analytics\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          test "$STATE" = success
