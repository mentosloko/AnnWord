name: Run Premium funnel analytics

on:
  push:
    branches: [main]
    paths:
      - 'scripts/run-premium-funnel-analytics.trigger'

permissions:
  contents: write
  statuses: write

concurrency:
  group: run-premium-funnel-analytics
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark analytics rollout pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"Premium Funnel Analytics\",\"description\":\"Applying and verifying analytics changes\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - name: Extract and run prepared patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/validate-legal-temp.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Patch Premium analytics and legal README'
          start = source.index(marker)
          run_line = source.index('        run: |', start)
          end = source.index('      - name: Setup Node.js', run_line)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[run_line + 1:end]) + '\n'
          Path('/tmp/apply-premium-analytics.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-premium-analytics.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify changes
        id: verify
        continue-on-error: true
        run: |
          set +e
          : > /tmp/premium-analytics-verification.log
          npm run lint >> /tmp/premium-analytics-verification.log 2>&1
          LINT_STATUS=$?
          npm run test:unit >> /tmp/premium-analytics-verification.log 2>&1
          UNIT_STATUS=$?
          npm run build >> /tmp/premium-analytics-verification.log 2>&1
          BUILD_STATUS=$?
          printf 'lint=%s\nunit=%s\nbuild=%s\n' "$LINT_STATUS" "$UNIT_STATUS" "$BUILD_STATUS" | tee /tmp/premium-analytics-status.txt
          cat /tmp/premium-analytics-verification.log
          test "$LINT_STATUS" -eq 0 -a "$UNIT_STATUS" -eq 0 -a "$BUILD_STATUS" -eq 0

      - name: Commit application changes and clean temporary files
        if: steps.verify.outcome == 'success'
        run: |
          rm -f \
            .github/workflows/validate-legal-temp.yml \
            .github/workflows/run-premium-funnel-analytics.yml \
            legal-validation.txt \
            scripts/run-premium-funnel-analytics.trigger \
            premium-analytics-verification.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Track Premium purchase funnel"
          git push

      - name: Commit verification diagnostic
        if: steps.verify.outcome == 'failure'
        run: |
          {
            cat /tmp/premium-analytics-status.txt
            echo
            tail -n 160 /tmp/premium-analytics-verification.log
          } > premium-analytics-verification.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add premium-analytics-verification.txt
          git commit -m "Record Premium analytics verification failure"
          git push

      - name: Publish analytics rollout status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = success ]; then
            STATE=success
            DESCRIPTION="Premium analytics verified and committed"
          else
            STATE=failure
            DESCRIPTION="Premium analytics verification failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"Premium Funnel Analytics\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          test "$STATE" = success
