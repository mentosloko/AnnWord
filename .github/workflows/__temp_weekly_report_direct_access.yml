name: Temp weekly report direct access

on:
  push:
    branches:
      - feat/weekly-report-direct-access
    paths:
      - .github/workflows/__temp_weekly_report_direct_access.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/weekly-report-direct-access
          fetch-depth: 0
      - name: Apply and verify weekly report changes
        shell: bash
        run: |
          python3 scripts/__temp_weekly_report_direct_access.py
          npm ci
          npm run lint
          npx vitest run tests/verifiedQaFixesRegression.test.ts tests/weeklyReportDirectAccess.test.ts
          npm exec -- vite build
      - name: Commit product changes
        shell: bash
        run: |
          rm .github/workflows/__temp_weekly_report_direct_access.yml
          rm scripts/__temp_weekly_report_direct_access.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: open weekly reports directly from email"
          git push origin HEAD:feat/weekly-report-direct-access
