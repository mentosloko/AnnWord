name: Temp P0 activation patch

on:
  push:
    branches:
      - fix/p0-activation-feedback
    paths:
      - .github/workflows/p0-activation-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-activation-feedback
          fetch-depth: 0
      - name: Apply patch and verify
        shell: bash
        run: |
          python3 scripts/__temp_p0_activation_patch.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/activationP0Regression.test.ts')
          text = path.read_text()
          old = "readFileSync(new URL(`../${path}`, import.meta.url), 'utf8')"
          new = "readFileSync(path, 'utf8')"
          if old not in text:
              raise SystemExit('regression read helper anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          npm ci
          npm run lint
          npx vitest run tests/activationP0Regression.test.ts tests/acquisitionFormsIntegrity.test.tsx
          npm exec -- vite build
      - name: Commit product changes
        shell: bash
        run: |
          rm .github/workflows/p0-activation-patcher.yml scripts/__temp_p0_activation_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve Kids first-session activation"
          git push origin HEAD:fix/p0-activation-feedback
