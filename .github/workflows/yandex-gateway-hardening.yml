# Production runtime is Yandex Cloud only. This workflow hardens the existing API Gateway
# without creating new cloud resources or changing the prepared backend instance count.
name: Harden Yandex API Gateway CORS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: yandex-api-gateway-hardening
  cancel-in-progress: true

jobs:
  harden-cors:
    name: Disable gateway-managed CORS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ORIGIN: https://annword.ru

    steps:
      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > yc-sa-key.json
          yc config profile create annword-gateway-hardening
          yc config set service-account-key yc-sa-key.json
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Disable automatic API Gateway CORS with rollback protection
        env:
          YC_API_PUBLIC_URL: ${{ secrets.YC_API_PUBLIC_URL }}
        run: |
          set -euo pipefail
          API_BASE="${YC_API_PUBLIC_URL%/}"

          DISCOVERY_HEADERS="$(curl -sSI -X OPTIONS \
            -H "Origin: ${APP_ORIGIN}" \
            -H 'Access-Control-Request-Method: POST' \
            "${API_BASE}/api/profile/coins" | tr -d '\r')"
          GATEWAY_ID="$(printf '%s\n' "$DISCOVERY_HEADERS" | awk 'tolower($1)=="x-serverless-gateway-id:" {print $2; exit}')"
          if [ -z "$GATEWAY_ID" ]; then
            echo 'Could not discover the Yandex API Gateway ID from the production API response.'
            exit 1
          fi
          echo "Discovered production API Gateway: ${GATEWAY_ID}"

          yc serverless api-gateway get-spec --id "$GATEWAY_ID" > /tmp/gateway-before.yaml
          cp /tmp/gateway-before.yaml /tmp/gateway-after.yaml

          python3 -m pip install --user --disable-pip-version-check --quiet 'PyYAML==6.0.2'
          python3 - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          import yaml

          path = Path('/tmp/gateway-after.yaml')
          spec = yaml.safe_load(path.read_text())
          if not isinstance(spec, dict):
              raise SystemExit('API Gateway specification is not a mapping')

          gateway = spec.get('x-yc-apigateway')
          if gateway is None:
              gateway = {}
              spec['x-yc-apigateway'] = gateway
          if not isinstance(gateway, dict):
              raise SystemExit('x-yc-apigateway must be a mapping')

          changed = gateway.get('cors') != {'origin': False}
          gateway['cors'] = {'origin': False}

          paths = spec.get('paths') or {}
          if not isinstance(paths, dict):
              raise SystemExit('paths must be a mapping')

          bridged_paths = 0
          for index, (path_name, path_item) in enumerate(paths.items(), start=1):
              if not isinstance(path_item, dict):
                  continue

              any_method = path_item.get('x-yc-apigateway-any-method')
              integration_type = None
              if isinstance(any_method, dict):
                  integration = any_method.get('x-yc-apigateway-integration')
                  if isinstance(integration, dict):
                      integration_type = integration.get('type')

              # Disable API Gateway's synthetic preflight response. For proxy routes,
              # add an explicit OPTIONS operation that reuses the same integration so
              # Express/cors is the single source of truth for allowed origins.
              if isinstance(any_method, dict):
                  if path_item.get('x-yc-apigateway-cors') != {'origin': False}:
                      path_item['x-yc-apigateway-cors'] = {'origin': False}
                      changed = True

                  options = path_item.get('options')
                  if not isinstance(options, dict) or 'x-yc-apigateway-integration' not in options:
                      options = deepcopy(any_method)
                      options.pop('operationId', None)
                      options['operationId'] = f'annwordCorsPreflight{index}'
                      path_item['options'] = options
                      changed = True
                      bridged_paths += 1
              elif 'x-yc-apigateway-cors' in path_item and path_item.get('x-yc-apigateway-cors') != {'origin': False}:
                  path_item['x-yc-apigateway-cors'] = {'origin': False}
                  changed = True

              print(
                  f'gateway_path={path_name} '
                  f'any_method={str(isinstance(any_method, dict)).lower()} '
                  f'options={str(isinstance(path_item.get("options"), dict)).lower()} '
                  f'integration={integration_type or "none"}'
              )

          if not any(
              isinstance(path_item, dict) and isinstance(path_item.get('x-yc-apigateway-any-method'), dict)
              for path_item in paths.values()
          ):
              raise SystemExit('No x-yc-apigateway-any-method proxy route found; refusing to rewrite gateway CORS blindly')

          path.write_text(yaml.safe_dump(spec, sort_keys=False, allow_unicode=True))
          if changed:
              Path('/tmp/gateway-cors-changed').write_text('1')
          print(f'gateway_cors_spec_changed={str(changed).lower()} bridged_paths={bridged_paths}')
          PY

          if [ -f /tmp/gateway-cors-changed ]; then
            UPDATED=1
            yc serverless api-gateway update --id "$GATEWAY_ID" --spec /tmp/gateway-after.yaml
          else
            echo 'API Gateway CORS is already delegated to the AnnWord backend.'
            UPDATED=0
          fi

          restore_on_failure() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ] && [ "${UPDATED:-0}" = "1" ]; then
              echo 'Gateway verification failed; restoring the previous API Gateway specification.'
              yc serverless api-gateway update --id "$GATEWAY_ID" --spec /tmp/gateway-before.yaml || true
            fi
            exit "$code"
          }
          trap restore_on_failure EXIT

          trusted_headers=''
          foreign_headers=''
          verify_cors() {
            trusted_headers="$(curl -sSI -X OPTIONS \
              -H "Origin: ${APP_ORIGIN}" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,x-annword-session' \
              "${API_BASE}/api/profile/coins?cors_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr -d '\r')"
            foreign_headers="$(curl -sSI -X OPTIONS \
              -H 'Origin: https://untrusted.example' \
              -H 'Access-Control-Request-Method: POST' \
              "${API_BASE}/api/profile/coins?cors_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr -d '\r')"

            printf '%s\n' "$trusted_headers" | grep -Eq '^HTTP/[^ ]+ 204 ' || return 1
            printf '%s\n' "$trusted_headers" | grep -Eqi '^access-control-max-age:[[:space:]]*3600([[:space:]]|$)' || return 1
            printf '%s\n' "$trusted_headers" | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://annword\.ru([[:space:]]|$)' || return 1
            if printf '%s\n' "$foreign_headers" | grep -Eqi '^access-control-allow-origin:'; then
              return 1
            fi
          }

          verified=0
          for attempt in $(seq 1 30); do
            if verify_cors; then
              verified=1
              break
            fi
            sleep 2
          done

          echo 'Trusted preflight after gateway hardening:'
          printf '%s\n' "$trusted_headers"
          echo 'Foreign preflight after gateway hardening:'
          printf '%s\n' "$foreign_headers"

          if [ "$verified" != "1" ]; then
            echo 'Trusted/untrusted CORS verification did not converge after the gateway update.'
            exit 1
          fi

          HEALTH_BODY="$(curl -fsS "${API_BASE}/api/health")"
          printf '%s' "$HEALTH_BODY" | grep -Eqi 'ok|healthy'
          trap - EXIT
          echo 'Yandex API Gateway now delegates CORS to the AnnWord backend; trusted origin passes and foreign origin is rejected.'
