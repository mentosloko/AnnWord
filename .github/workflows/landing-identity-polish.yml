name: Landing identity polish one-shot

on:
  push:
    branches:
      - agent/landing-identity-copy-reference

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Polish landing identity against product truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/landing-identity-copy-reference
          fetch-depth: 0
      - name: Apply final polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          header = 'components/layout/AppHeader.tsx'
          replace(header,
              "  const guestTeacherLanding = !isAuthenticated && typeof window !== 'undefined' && (window.location.pathname.replace(/\\/+$/, '') || '/') === '/teacher';\n  const guestParentLanding = !isAuthenticated && !guestTeacherLanding;",
              "  const guestPath = !isAuthenticated && typeof window !== 'undefined' ? (window.location.pathname.replace(/\\/+$/, '') || '/') : '';\n  const guestTeacherLanding = guestPath === '/teacher';\n  const guestParentLanding = !isAuthenticated && (guestPath === '/' || guestPath === '/kids' || guestPath === '/landing-mix');"
          )

          landing = 'components/screens/LandingMixScreen.tsx'
          replace(landing,
              "  { icon: '⏱', title: 'Короткие игровые сессии', text: 'Легко встроить в обычный день' },\n  { icon: '⊘', title: 'Без рекламы — гарантировано', text: 'Никаких баннеров и роликов' },\n  { icon: '◆', title: 'Безопасная среда', text: 'Без лишнего отвлекающего контента' },\n  { icon: '↗', title: 'Понятный прогресс для родителей', text: 'Видно, что уже получается' },",
              "  { icon: '⏱', title: 'Короткие игровые сессии', text: '' },\n  { icon: '⊘', title: 'Без рекламы — гарантировано', text: '' },\n  { icon: '◆', title: 'Безопасная среда', text: '' },\n  { icon: '↗', title: 'Понятный прогресс для родителей', text: '' },"
          )
          replace(landing,
              "<h1 className=\"mt-5 max-w-xl text-4xl font-black leading-[0.96] tracking-[-0.048em] text-indigo-950 sm:text-6xl lg:text-[4.55rem]\">",
              "<h1 className=\"max-w-xl text-4xl font-black leading-[0.96] tracking-[-0.048em] text-indigo-950 sm:text-6xl lg:text-[4.55rem]\">"
          )
          replace(landing,
              "className=\"flex min-h-[5.75rem] items-center gap-3 rounded-[1.35rem] px-3 py-3 transition hover:bg-indigo-50/60\"",
              "className=\"flex min-h-[4.75rem] items-center gap-3 rounded-[1.35rem] px-3 py-3 transition hover:bg-indigo-50/60\""
          )
          replace(landing,
              "<p className=\"mt-1 text-[11px] font-bold leading-snug text-slate-400\">{item.text}</p>",
              "{item.text && <p className=\"mt-1 text-[11px] font-bold leading-snug text-slate-400\">{item.text}</p>}"
          )
          replace(landing,
              "          <div className=\"mt-5 rounded-2xl border border-blue-100 bg-blue-50/80 px-4 py-3 text-center text-xs font-bold leading-relaxed text-blue-700\">В «Виселице» ошибки снимают сердечки — без изображения повешения. В «Змейке» слово собирается только по соседним клеткам.</div>\n",
              ""
          )
          replace(landing,
              "            <div className=\"mt-5 grid gap-2 rounded-[1.7rem] bg-white/95 p-3 text-indigo-950 sm:grid-cols-3\"><div className=\"rounded-2xl bg-indigo-50 p-4\"><div className=\"text-sm font-black\">Без рекламы — гарантировано</div><p className=\"mt-1 text-xs font-bold leading-relaxed text-slate-500\">Никаких рекламных баннеров, роликов и сторонних вставок.</p></div><div className=\"rounded-2xl bg-indigo-50 p-4\"><div className=\"text-sm font-black\">Меньше уговоров</div><p className=\"mt-1 text-xs font-bold leading-relaxed text-slate-500\">Игры, питомец и награды дают ребёнку понятную причину вернуться.</p></div><div className=\"rounded-2xl bg-indigo-50 p-4\"><div className=\"text-sm font-black\">Результат перед глазами</div><p className=\"mt-1 text-xs font-bold leading-relaxed text-slate-500\">Родитель видит прогресс и понимает, где ещё нужна практика.</p></div></div>\n",
              ""
          )
          replace(landing,
              "<p className=\"mt-2 text-sm font-bold text-indigo-100\">7 дней бесплатно. Карта не требуется.</p>",
              "<p className=\"mt-2 text-sm font-bold text-indigo-100\">Без рекламы. С прогрессом, который видно.</p>"
          )
          PY
      - name: Commit result and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "mentosloko"
          git config user.email "mentosloko@gmail.com"
          git rm .github/workflows/landing-identity-polish.yml
          git add components/screens/LandingMixScreen.tsx components/layout/AppHeader.tsx
          git commit -m "Polish landing identity against product truth"
          git push origin HEAD:agent/landing-identity-copy-reference
