name: Temporary optimize daily world backgrounds

on:
  push:
    branches:
      - perf/responsive-daily-world-backgrounds

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/responsive-daily-world-backgrounds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate high-quality responsive variants
        run: |
          npm install --no-save --no-package-lock sharp@0.34.4
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const sharp = require('sharp');

          const dir = 'public/assets/rooms/daily';
          const names = ['theatre', 'amusement-park', 'ice-rink', 'opera', 'sausage-fridge'];
          const widths = [960, 1440];

          (async () => {
            for (const name of names) {
              const source = path.join(dir, `${name}.webp`);
              const meta = await sharp(source).metadata();
              const sourceBytes = fs.statSync(source).size;
              console.log(`${name}: source ${meta.width}x${meta.height}, ${sourceBytes} bytes`);
              for (const width of widths) {
                const target = path.join(dir, `${name}-${width}.webp`);
                await sharp(source)
                  .resize({ width, withoutEnlargement: true, kernel: sharp.kernel.lanczos3 })
                  .webp({ quality: 100, smartSubsample: true, effort: 6 })
                  .toFile(target);
                const outMeta = await sharp(target).metadata();
                const outBytes = fs.statSync(target).size;
                console.log(`  ${path.basename(target)}: ${outMeta.width}x${outMeta.height}, ${outBytes} bytes (${(100 * outBytes / sourceBytes).toFixed(1)}% of source)`);
              }
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Remove temporary workflow and commit variants
        run: |
          rm .github/workflows/__temp_optimize_daily_worlds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/rooms/daily .github/workflows/__temp_optimize_daily_worlds.yml
          git commit -m "perf: add responsive daily world backgrounds"
          git push origin HEAD:perf/responsive-daily-world-backgrounds
