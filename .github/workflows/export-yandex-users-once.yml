name: Export Yandex users once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: annword-yandex-user-export
  cancel-in-progress: true

jobs:
  export-users:
    if: ${{ github.head_ref == 'ops/export-yandex-users-20260804' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
      EXPORT_PUBLIC_KEY_B64: 
    steps:
      - name: Delete previous export artifacts
        run: |
          set -euo pipefail
          for artifact_name in annword-yandex-users-20260804 annword-yandex-users-encrypted-20260804; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" > "/tmp/${artifact_name}.json"
            node -e 'const fs=require("fs");const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const item of body.artifacts||[])console.log(item.id)' "/tmp/${artifact_name}.json" | while read -r artifact_id; do
              test -n "$artifact_id" || continue
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and configure Yandex Cloud CLI
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > /tmp/yc-key.json
          "$HOME/yandex-cloud/bin/yc" config profile create annword-user-export
          "$HOME/yandex-cloud/bin/yc" config set service-account-key /tmp/yc-key.json
          "$HOME/yandex-cloud/bin/yc" config set cloud-id "$YC_CLOUD_ID"
          "$HOME/yandex-cloud/bin/yc" config set folder-id "$YC_FOLDER_ID"

      - name: Prepare temporary encrypted export function
        run: |
          set -euo pipefail
          FUNCTION_NAME="annword-export-users-${GITHUB_RUN_ID}"
          echo "FUNCTION_NAME=$FUNCTION_NAME" >> "$GITHUB_ENV"
          rm -rf /tmp/annword-export-function
          mkdir -p /tmp/annword-export-function
          cat > /tmp/annword-export-function/package.json <<'JSON'
          {
            "name": "annword-user-export-function",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "pg": "8.16.3" }
          }
          JSON
          cat > /tmp/annword-export-function/index.js <<'NODE'
          const crypto = require('node:crypto');
          const { Pool } = require('pg');

          const normalizeConnectionString = (value) => {
            const url = new URL(value);
            for (const key of ['sslmode', 'sslcert', 'sslkey', 'sslrootcert']) url.searchParams.delete(key);
            return url.toString();
          };
          const dateValue = (value) => value ? new Date(value).toISOString() : null;
          const countValue = (value) => Number.isFinite(Number(value)) ? Number(value) : 0;
          const maxDate = (...values) => {
            const times = values.filter(Boolean).map(value => new Date(value).getTime()).filter(Number.isFinite);
            return times.length ? new Date(Math.max(...times)).toISOString() : null;
          };
          const mapByUser = (rows) => new Map(rows.map(row => [String(row.user_id), row]));

          exports.handler = async function () {
            const pool = new Pool({
              connectionString: normalizeConnectionString(process.env.DATABASE_URL || ''),
              ssl: { rejectUnauthorized: false },
              max: 1,
              connectionTimeoutMillis: 10000,
            });
            try {
              const base = await pool.query(`
                select
                  u.id::text as user_id,
                  u.email,
                  u.full_name,
                  u.provider,
                  u.email_confirmed_at,
                  u.password_reset_required,
                  u.created_at as user_created_at,
                  u.updated_at as user_updated_at,
                  p.username,
                  p.role,
                  p.account_mode,
                  p.subscription_tier,
                  p.premium_expires_at,
                  p.child_display_name,
                  p.weekly_report_email,
                  p.coins,
                  p.stats,
                  p.custom_dictionary_en,
                  p.inventory,
                  p.created_at as profile_created_at,
                  p.updated_at as profile_updated_at
                from public.app_users u
                left join public.profiles p on p.id = u.id
                order by u.created_at asc, lower(u.email) asc
              `);

              const relationExists = async (name) => {
                const result = await pool.query('select to_regclass($1) as relation', [`public.${name}`]);
                return Boolean(result.rows[0] && result.rows[0].relation);
              };
              const gameRows = await relationExists('game_events')
                ? (await pool.query('select user_id::text, count(*)::int as event_count, max(occurred_at) as last_at from public.game_events group by user_id')).rows
                : [];
              const analyticsRows = await relationExists('analytics_events')
                ? (await pool.query('select user_id::text, count(*)::int as event_count, max(occurred_at) as last_at from public.analytics_events where user_id is not null group by user_id')).rows
                : [];
              const questRows = await relationExists('daily_quests')
                ? (await pool.query('select user_id::text, count(*)::int as quest_count, max(updated_at) as last_at from public.daily_quests group by user_id')).rows
                : [];
              const paymentRows = await relationExists('premium_payments')
                ? (await pool.query("select user_id::text, count(*)::int as payment_count, count(*) filter (where status = 'paid')::int as paid_payment_count, max(created_at) as last_payment_at, max(paid_at) as last_paid_at from public.premium_payments group by user_id")).rows
                : [];

              const games = mapByUser(gameRows);
              const analytics = mapByUser(analyticsRows);
              const quests = mapByUser(questRows);
              const payments = mapByUser(paymentRows);
              const users = base.rows.map(row => {
                const game = games.get(row.user_id) || {};
                const analytic = analytics.get(row.user_id) || {};
                const quest = quests.get(row.user_id) || {};
                const payment = payments.get(row.user_id) || {};
                const stats = row.stats && typeof row.stats === 'object' ? row.stats : {};
                return {
                  user_id: row.user_id,
                  email: row.email,
                  full_name: row.full_name,
                  provider: row.provider,
                  email_confirmed_at: dateValue(row.email_confirmed_at),
                  password_reset_required: Boolean(row.password_reset_required),
                  user_created_at: dateValue(row.user_created_at),
                  user_updated_at: dateValue(row.user_updated_at),
                  username: row.username,
                  role: row.role,
                  account_mode: row.account_mode,
                  subscription_tier: row.subscription_tier,
                  premium_expires_at: dateValue(row.premium_expires_at),
                  child_display_name: row.child_display_name,
                  weekly_report_email: row.weekly_report_email,
                  coins: countValue(row.coins),
                  games_played: countValue(stats.gamesPlayed),
                  games_won: countValue(stats.gamesWon),
                  custom_dictionary_word_count: Array.isArray(row.custom_dictionary_en) ? row.custom_dictionary_en.length : 0,
                  inventory_item_count: Array.isArray(row.inventory) ? row.inventory.length : 0,
                  profile_created_at: dateValue(row.profile_created_at),
                  profile_updated_at: dateValue(row.profile_updated_at),
                  game_event_count: countValue(game.event_count),
                  last_game_at: dateValue(game.last_at),
                  analytics_event_count: countValue(analytic.event_count),
                  last_analytics_at: dateValue(analytic.last_at),
                  daily_quest_count: countValue(quest.quest_count),
                  last_quest_at: dateValue(quest.last_at),
                  payment_count: countValue(payment.payment_count),
                  paid_payment_count: countValue(payment.paid_payment_count),
                  last_payment_at: dateValue(payment.last_payment_at),
                  last_paid_at: dateValue(payment.last_paid_at),
                  last_activity_at: maxDate(row.user_updated_at, row.profile_updated_at, game.last_at, analytic.last_at, quest.last_at, payment.last_payment_at),
                };
              });

              const payload = Buffer.from(JSON.stringify({ exported_at: new Date().toISOString(), count: users.length, users }), 'utf8');
              const publicKey = Buffer.from(process.env.EXPORT_PUBLIC_KEY_B64 || '', 'base64').toString('utf8');
              const key = crypto.randomBytes(32);
              const iv = crypto.randomBytes(12);
              const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
              const ciphertext = Buffer.concat([cipher.update(payload), cipher.final()]);
              const tag = cipher.getAuthTag();
              const encryptedKey = crypto.publicEncrypt({ key: publicKey, oaepHash: 'sha256', padding: crypto.constants.RSA_PKCS1_OAEP_PADDING }, key);
              const envelope = {
                version: 1,
                algorithm: 'RSA-OAEP-SHA256+AES-256-GCM',
                exported_at: new Date().toISOString(),
                count: users.length,
                encrypted_key: encryptedKey.toString('base64'),
                iv: iv.toString('base64'),
                tag: tag.toString('base64'),
                ciphertext: ciphertext.toString('base64'),
              };
              return { statusCode: 200, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(envelope) };
            } catch (error) {
              return { statusCode: 500, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ error: error instanceof Error ? error.message : 'export_failed' }) };
            } finally {
              await pool.end().catch(() => undefined);
            }
          };
          NODE
          cd /tmp/annword-export-function
          npm install --omit=dev --ignore-scripts
          zip -qr /tmp/annword-export-function.zip .

      - name: Deploy and invoke temporary function inside Yandex VPC
        run: |
          set -euo pipefail
          yc vpc network list --format json-rest > /tmp/networks.json
          NETWORK_ID="$(node -e 'const fs=require("fs");const body=JSON.parse(fs.readFileSync("/tmp/networks.json","utf8"));const rows=Array.isArray(body)?body:(body.networks||body.items||[]);if(!rows.length)process.exit(2);process.stdout.write(rows[0].id)')"
          test -n "$NETWORK_ID"
          yc serverless function create --name "$FUNCTION_NAME" --description "Temporary encrypted AnnWord user export"
          yc serverless function version create \
            --function-name "$FUNCTION_NAME" \
            --runtime nodejs22 \
            --entrypoint index.handler \
            --memory 512MB \
            --execution-timeout 30s \
            --service-account-id "$YC_SERVICE_ACCOUNT_ID" \
            --network-id "$NETWORK_ID" \
            --source-path /tmp/annword-export-function.zip \
            --environment DATABASE_URL="$DATABASE_URL" \
            --environment EXPORT_PUBLIC_KEY_B64="$EXPORT_PUBLIC_KEY_B64"
          yc serverless function invoke "$FUNCTION_NAME" -d '{}' --format json > /tmp/function-invoke.json
          mkdir -p /tmp/annword-user-export-encrypted
          node - <<'NODE'
          const fs = require('fs');
          const outer = JSON.parse(fs.readFileSync('/tmp/function-invoke.json', 'utf8'));
          let body = outer;
          if (typeof outer.body === 'string') body = JSON.parse(outer.body);
          else if (outer.body && typeof outer.body === 'object') body = outer.body;
          if (Number(outer.statusCode || 200) >= 400 || body.error || !body.ciphertext || !body.encrypted_key) {
            throw new Error(body.error || `Invalid function response: ${JSON.stringify(outer).slice(0, 500)}`);
          }
          fs.writeFileSync('/tmp/annword-user-export-encrypted/annword-yandex-users.envelope.json', JSON.stringify(body, null, 2));
          fs.writeFileSync('/tmp/annword-user-export-encrypted/README.txt', `Encrypted user export. Rows: ${body.count}. Algorithm: ${body.algorithm}. Public key fingerprint: 25:59:B8:62:9B:76:12:93:BA:62:76:BA:77:B4:A7:A2:80:B8:42:CB:E5:F3:B8:B4:8E:16:3F:A1:0A:C3:0E:64\n`);
          console.log(`Encrypted ${body.count} user records inside Yandex VPC.`);
          NODE

      - name: Upload encrypted one-time artifact
        uses: actions/upload-artifact@v4
        with:
          name: annword-yandex-users-encrypted-20260804
          path: /tmp/annword-user-export-encrypted/
          if-no-files-found: error
          retention-days: 1

      - name: Delete temporary Yandex function
        if: always()
        run: |
          if [ -n "${FUNCTION_NAME:-}" ]; then
            yc serverless function delete --name "$FUNCTION_NAME" || true
          fi
          rm -f /tmp/yc-key.json /tmp/function-invoke.json
