name: Yandex API Keep Warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-api-keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      KEEP_WARM_START_AT: '2026-08-26T09:15:00Z'
      KEEP_WARM_URL: 'https://api.annword.ru/api/health/db'
    steps:
      - name: Wait for baseline window
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "$KEEP_WARM_START_AT" +%s)"
          if (( now_epoch < start_epoch )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Keep-warm is intentionally disabled until $KEEP_WARM_START_AT."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping API and database
        if: steps.baseline.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            --retry 1 \
            --retry-delay 2 \
            --header 'Cache-Control: no-cache' \
            --user-agent 'AnnWord-GitHub-Keep-Warm/1.0' \
            "$KEEP_WARM_URL" >/dev/null
          echo "Keep-warm ping succeeded at $(date -u --iso-8601=seconds)."