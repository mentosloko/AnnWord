name: Import parent landing assets once

on:
  push:
    branches:
      - agent/final-parent-landing-assets
    paths:
      - .tmp/landing-assets/ready.txt

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-parent-landing-assets
          fetch-depth: 0
      - name: Decode production landing assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/landing/final
          cat .tmp/landing-assets/hero.part* | base64 --decode > public/landing/final/hero-scene.webp
          cat .tmp/landing-assets/atlas.part* | base64 --decode > public/landing/final/landing-atlas.webp
          file public/landing/final/hero-scene.webp
          file public/landing/final/landing-atlas.webp
          test "$(stat -c%s public/landing/final/hero-scene.webp)" -gt 90000
          test "$(stat -c%s public/landing/final/landing-atlas.webp)" -gt 300000
          rm -rf .tmp/landing-assets
      - name: Commit assets to technical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "annword-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/landing/final .tmp || true
          git commit -m "Add final parent landing assets"
          git push origin HEAD:agent/final-parent-landing-assets
