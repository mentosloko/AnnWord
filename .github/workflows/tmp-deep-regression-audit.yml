            username,
            coins,
            stats: { ...GUEST_PROFILE.stats, wordsGuessed: { ...GUEST_PROFILE.stats.wordsGuessed } },
            pet: { ...GUEST_PROFILE.pet, equippedAccessories: [...(GUEST_PROFILE.pet.equippedAccessories || [])] },
