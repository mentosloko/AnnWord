name: Yandex Log Audit

on:
  push:
    branches:
      - agent/yandex-log-audit
    paths:
      - '.github/workflows/yandex-log-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/yandex-log-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Yandex Cloud CLI
        run: |
          set -euo pipefail
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > /tmp/yc-key.json
          yc config profile create annword-log-audit
          yc config set service-account-key /tmp/yc-key.json
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Discover logging resources and revision settings
        env:
          CONFIGURED_CONTAINER_ID: ${{ secrets.YC_SERVERLESS_CONTAINER_ID }}
        run: |
          set -euo pipefail
          yc serverless container list --format=json > /tmp/containers.json
          yc serverless container revision list --container-id "$CONFIGURED_CONTAINER_ID" --format=json > /tmp/revisions.json
          yc logging group list --format=json > /tmp/log-groups.json
          echo '=== SERVERLESS CONTAINERS ==='
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/containers.json','utf8'));
          const a=Array.isArray(x)?x:(x.containers||x.items||[]);
          for(const c of a) console.log(JSON.stringify({id:c.id,name:c.name,created_at:c.created_at||c.createdAt||null,status:c.status||null}));
          NODE
          echo '=== LATEST REVISIONS ==='
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/revisions.json','utf8'));
          const a=Array.isArray(x)?x:(x.revisions||x.items||[]);
          for(const r of a.slice(0,8)) console.log(JSON.stringify({id:r.id,created_at:r.created_at||r.createdAt||null,status:r.status||null,execution_timeout:r.execution_timeout||r.executionTimeout||null,concurrency:r.concurrency||null,resources:r.resources||null,log_options:r.log_options||r.logOptions||null,image:r.image?.image_url||r.image?.imageUrl||null}));
          NODE
          echo '=== LOG GROUPS ==='
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/log-groups.json','utf8'));
          const a=Array.isArray(x)?x:(x.groups||x.items||[]);
          for(const g of a) console.log(JSON.stringify({id:g.id,name:g.name,retention_period:g.retention_period||g.retentionPeriod||null,status:g.status||null}));
          NODE

      - name: Read default log group
        run: |
          set -euo pipefail
          yc logging read \
            --group-name=default \
            --since='72h' \
            --limit=1000 \
            --max-response-size=20MB \
            --format=json > /tmp/annword-api-logs.json
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("/tmp/annword-api-logs.json","utf8")); console.log(`Fetched ${Array.isArray(a)?a.length:0} default-group log entries`);'

      - name: Summarize errors and timeouts
        env:
          CONFIGURED_CONTAINER_ID: ${{ secrets.YC_SERVERLESS_CONTAINER_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const logs = JSON.parse(fs.readFileSync('/tmp/annword-api-logs.json','utf8'));
          const entries = Array.isArray(logs) ? logs : [];
          const scrub = (value) => String(value ?? '')
            .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '<email>')
            .replace(/\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b/gi, '<uuid>')
            .replace(/(Bearer\s+|X-AnnWord-Session[=:]\s*)[^\s,"']+/gi, '$1<redacted>')
            .slice(0, 1400);
          const text = (e) => [e.message, JSON.stringify(e.json_payload || e.jsonPayload || {})].filter(Boolean).join(' ');
          const suspiciousRe = /(error|fail|timeout|timed out|slow|pool|connect|connection|econn|postgres|database|deadlock|cancel|abort|5\d\d|too many|remaining connection|socket|reset|terminated|unavailable|deadline)/i;
          const suspicious = entries.filter(e => suspiciousRe.test(text(e)) || ['ERROR','FATAL','WARN'].includes(String(e.level || '').toUpperCase()));
          console.log('=== LOG SUMMARY ===');
          console.log(JSON.stringify({total:entries.length,suspicious:suspicious.length},null,2));
          console.log('=== RECENT SUSPICIOUS ENTRIES ===');
          for (const e of suspicious.slice(-200)) console.log(`${e.timestamp || ''} [${e.level || 'UNSPECIFIED'}] ${scrub(text(e))}`);
          NODE

      - name: Upload diagnostic sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-api-log-audit
          path: |
            /tmp/annword-api-logs.json
            /tmp/containers.json
            /tmp/revisions.json
            /tmp/log-groups.json
          retention-days: 1
          if-no-files-found: ignore
