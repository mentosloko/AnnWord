name: One-time Yandex user cleanup
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: one-time-yandex-user-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ github.head_ref == 'ops/cleanup-users-20260805-1906' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Yandex Cloud CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > /tmp/yc-key.json
          "$HOME/yandex-cloud/bin/yc" config profile create annword-cleanup
          "$HOME/yandex-cloud/bin/yc" config set service-account-key /tmp/yc-key.json
          "$HOME/yandex-cloud/bin/yc" config set cloud-id "$YC_CLOUD_ID"
          "$HOME/yandex-cloud/bin/yc" config set folder-id "$YC_FOLDER_ID"
      - name: Verify fresh backup and resolve cluster network
        env:
          CONFIGURED_CLUSTER_ID: ${{ secrets.YC_POSTGRES_CLUSTER_ID }}
        run: |
          set -euo pipefail
          CLUSTER_ID="${CONFIGURED_CLUSTER_ID:-}"
          if [ -z "$CLUSTER_ID" ]; then
            yc managed-postgresql cluster list --format json-rest > /tmp/clusters.json
            CLUSTER_ID="$(node -e 'const x=require("/tmp/clusters.json");const a=Array.isArray(x)?x:(x.clusters||x.items||[]);if(a.length!==1)process.exit(2);process.stdout.write(a[0].id)')"
          fi
          yc managed-postgresql cluster list-backups --id "$CLUSTER_ID" --format json-rest > /tmp/backups.json
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/backups.json','utf8'));
          const a = Array.isArray(x) ? x : (x.backups || x.items || []);
          const latest = a.filter(b => String(b.status || '').toUpperCase() === 'DONE')
            .sort((l,r) => Date.parse(r.createdAt || r.created_at || r.startedAt || r.started_at || 0) - Date.parse(l.createdAt || l.created_at || l.startedAt || l.started_at || 0))[0];
          if (!latest) throw new Error('No completed PostgreSQL backup');
          const at = Date.parse(latest.createdAt || latest.created_at || latest.startedAt || latest.started_at || '');
          if (!Number.isFinite(at) || Date.now() - at > 30 * 60 * 1000) throw new Error('Latest backup is not fresh enough');
          fs.writeFileSync('/tmp/fresh-backup.json', JSON.stringify(latest, null, 2));
          console.log(`Fresh backup verified: ${new Date(at).toISOString()}`);
          NODE
          yc managed-postgresql cluster get --id "$CLUSTER_ID" --format json-rest > /tmp/cluster.json
          NETWORK_ID="$(node -e 'const x=require("/tmp/cluster.json");const id=x.networkId||x.network_id||(x.network&&x.network.id);if(!id)process.exit(2);process.stdout.write(id)')"
          echo "CLUSTER_ID=$CLUSTER_ID" >> "$GITHUB_ENV"
          echo "NETWORK_ID=$NETWORK_ID" >> "$GITHUB_ENV"
      - name: Build one-time cleanup function
        run: |
          set -euo pipefail
          mkdir -p /tmp/annword-cleanup-function
          cd /tmp/annword-cleanup-function
          npm init -y >/dev/null
          npm install pg@8 --omit=dev --silent
          cat > index.js <<'JS'
          const { Client } = require('pg');
          const keep = ['alex-manto@yandex.ru', 'manto.alexander@gmail.com', 'anna.a.manto@gmail.com'];

          exports.handler = async () => {
            const url = new URL(process.env.DATABASE_URL);
            url.searchParams.delete('sslmode');
            const client = new Client({ connectionString: url.toString(), ssl: false });
            try {
              await client.connect();
              await client.query('begin');
              await client.query("select pg_advisory_xact_lock(hashtext('annword-one-time-user-cleanup'))");
              const protectedUsers = Number((await client.query('select count(*)::int as count from public.app_users where lower(email) = any($1::text[])', [keep])).rows[0].count);
              const protectedProfiles = Number((await client.query('select count(*)::int as count from public.profiles p join public.app_users u on u.id=p.id where lower(u.email) = any($1::text[])', [keep])).rows[0].count);
              if (protectedUsers !== 3 || protectedProfiles !== 3) throw new Error(`Safety stop: protected users=${protectedUsers}, profiles=${protectedProfiles}`);
              const before = Number((await client.query('select count(*)::int as count from public.app_users')).rows[0].count);
              const pendingExists = (await client.query("select to_regclass('public.pending_email_registrations') as table_name")).rows[0].table_name;
              if (pendingExists) await client.query('delete from public.pending_email_registrations where not (lower(email) = any($1::text[]))', [keep]);
              const confirmationsExist = (await client.query("select to_regclass('public.email_confirmations') as table_name")).rows[0].table_name;
              if (confirmationsExist) await client.query('delete from public.email_confirmations where not (lower(email) = any($1::text[]))', [keep]);
              const deleted = await client.query('delete from public.app_users where not (lower(email) = any($1::text[]))', [keep]);
              const after = Number((await client.query('select count(*)::int as count from public.app_users')).rows[0].count);
              const profilesAfter = Number((await client.query('select count(*)::int as count from public.profiles')).rows[0].count);
              const unexpected = Number((await client.query('select count(*)::int as count from public.app_users where not (lower(email) = any($1::text[]))', [keep])).rows[0].count);
              if (after !== 3 || profilesAfter !== 3 || unexpected !== 0) throw new Error(`Verification failed: users=${after}, profiles=${profilesAfter}, unexpected=${unexpected}`);
              await client.query('commit');
              return { statusCode: 200, body: JSON.stringify({ ok: true, usersBefore: before, usersDeleted: deleted.rowCount, usersAfter: after, profilesAfter }) };
            } catch (error) {
              try { await client.query('rollback'); } catch {}
              return { statusCode: 500, body: JSON.stringify({ ok: false, error: String(error && error.message || error) }) };
            } finally {
              await client.end().catch(() => {});
            }
          };
          JS
          zip -qr /tmp/annword-cleanup-function.zip .
      - name: Deploy and invoke cleanup function in the database network
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          FUNCTION_NAME="annword-user-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "FUNCTION_NAME=$FUNCTION_NAME" >> "$GITHUB_ENV"
          yc serverless function create --name "$FUNCTION_NAME" --description 'Temporary AnnWord user cleanup'
          yc serverless function version create \
            --function-name "$FUNCTION_NAME" \
            --runtime nodejs22 \
            --entrypoint index.handler \
            --memory 256m \
            --execution-timeout 60s \
            --service-account-id "$YC_SERVICE_ACCOUNT_ID" \
            --network-id "$NETWORK_ID" \
            --source-path /tmp/annword-cleanup-function.zip \
            --environment DATABASE_URL="$DATABASE_URL"
          yc serverless function invoke "$FUNCTION_NAME" -d '{}' > /tmp/function-response.json
          cat /tmp/function-response.json
          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('/tmp/function-response.json','utf8'));
          const body = typeof response.body === 'string' ? JSON.parse(response.body) : response.body;
          if (Number(response.statusCode) !== 200 || !body?.ok || body.usersAfter !== 3 || body.profilesAfter !== 3) {
            throw new Error(`Cleanup function failed: ${JSON.stringify(response)}`);
          }
          fs.writeFileSync('/tmp/cleanup-summary.json', JSON.stringify(body, null, 2));
          console.log(`Cleanup verified: before=${body.usersBefore}, deleted=${body.usersDeleted}, after=${body.usersAfter}, profiles=${body.profilesAfter}`);
          NODE
      - name: Delete temporary cleanup function
        if: always()
        run: |
          if [ -n "${FUNCTION_NAME:-}" ]; then yc serverless function delete "$FUNCTION_NAME" || true; fi
      - name: Upload private cleanup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-user-cleanup-audit
          path: |
            /tmp/fresh-backup.json
            /tmp/backups.json
            /tmp/cluster.json
            /tmp/function-response.json
            /tmp/cleanup-summary.json
          if-no-files-found: ignore
          retention-days: 1
