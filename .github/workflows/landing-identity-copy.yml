name: Landing identity copy one-shot

on:
  push:
    branches:
      - agent/landing-identity-copy-reference

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Align landing identity and copy with approved reference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/landing-identity-copy-reference
          fetch-depth: 0
      - name: Apply reference identity and copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_all(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text)

          landing_replacements = [
              ("  { title: 'Скучно и утомительно', text: 'Списки слов быстро превращаются в рутину и вызывают сопротивление.' },", "  { title: 'Скучно и утомительно', text: 'Монотонные списки быстро утомляют и отбивают интерес.' },"),
              ("  { title: 'Слова забываются', text: 'Без повторения в разных контекстах новые слова быстро выпадают из памяти.' },", "  { title: 'Слова забываются', text: 'Нет практики в контексте — слова не остаются в памяти.' },"),
              ("  { title: 'Оценки давят', text: 'Страх ошибок мешает спокойно вспоминать, пробовать и закреплять лексику.' },", "  { title: 'Оценки давят', text: 'Страх ошибок и оценок снижает мотивацию.' },"),
              ("  { title: 'Родителям сложно', text: 'Непонятно, что ребёнок уже выучил и какие слова всё ещё требуют внимания.' },", "  { title: 'Родителям сложно', text: 'Непонятно, как помочь и есть ли результат.' },"),
              ("  { title: 'Вы добавляете слова', text: 'Загрузите список преподавателя или внесите слова и перевод вручную.' },", "  { title: 'Добавляете школьные слова', text: 'Загрузите список или добавьте слова вручную. Укажите перевод и контекст.' },"),
              ("  { title: 'Ребёнок играет и учит', text: 'Короткие игровые сессии возвращают к тем же словам разными способами.' },", "  { title: 'Ребёнок играет и учит слова', text: 'Короткие игровые сессии помогают понять, запомнить и применять слова.' },"),
              ("  { title: 'Вы видите прогресс', text: 'В кабинете видно динамику, серию занятий и слова, которые требуют повторения.' },", "  { title: 'Вы видите прогресс', text: 'Отчёты и статистика показывают, что уже получается и где нужна помощь.' },"),
              ("  { icon: '↗', title: 'Понятный прогресс', text: 'Родитель видит результат' },", "  { icon: '↗', title: 'Понятный прогресс для родителей', text: 'Видно, что уже получается' },"),
              ("const childBenefits = [\n  'Учёба проходит через игру, а не через длинные списки',\n  'Разные механики не дают устать от повторения',\n  'За успехи появляются монеты, награды и аксессуары',\n  'Питомец растёт вместе с прогрессом ребёнка',\n];", "const childBenefits = [\n  'Учит школьные слова в игре',\n  'Лучше запоминает и понимает слова',\n  'Повышает уверенность и мотивацию',\n  'Получает награды и растит питомца',\n  'Видит свой прогресс каждый день',\n];"),
              ("const parentBenefits = [\n  'Видите реальный прогресс и статистику занятий',\n  'Понимаете, какие слова вызывают трудности',\n  'Экономите время на проверках и дополнительных заданиях',\n  'Спокойны: в приложении гарантированно нет рекламы',\n];", "const parentBenefits = [\n  'Видите реальный прогресс и статистику',\n  'Экономите время и нервы',\n  'Понимаете, какие слова даются труднее',\n  'Спокойны: приложение без рекламы',\n  'Ребёнок учится с удовольствием',\n];"),
              ("  { title: 'Вордл', subtitle: 'Угадайте слово за 6 попыток',", "  { title: 'Вордл', subtitle: 'Угадай слово за 6 попыток',"),
              ("  { title: 'Виселица', subtitle: 'Открывайте буквы, сохраняя сердечки',", "  { title: 'Виселица', subtitle: 'Открывай буквы и сохраняй жизни',"),
              ("  { title: 'Анаграммы', subtitle: 'Соберите английское слово по переводу',", "  { title: 'Анаграммы', subtitle: 'Составляй слова из букв',"),
              ("  { title: 'Спринт', subtitle: 'Найдите английское слово на скорость',", "  { title: 'Спринт', subtitle: 'Отвечай быстро и зарабатывай очки',"),
              ("  { title: 'Змейка', subtitle: 'Соберите слово по соседним клеткам',", "  { title: 'Змейка', subtitle: 'Собирай слова и расти!',"),
              ("<span>🔥 3 дня</span>", "<span>🔥 3 дня подряд!</span>"),
              (">Выучить 15 слов<", ">Выучить 15 новых слов<"),
              (">Награда</span><span className=\"text-base font-black text-violet-700\">+50 🪙<", ">Получено наград</span><span className=\"text-base font-black text-violet-700\">+50 🪙<"),
              ("    [asset('pet-stage-1.webp'), 'Малыш'],\n    [asset('pet-stage-2.webp'), 'Подрос'],", "    [asset('pet-stage-1.webp'), 'Щенок'],\n    [asset('pet-stage-2.webp'), 'Малыш'],"),
              ("    [asset('reward-coins.webp'), 'Монеты'],\n    [asset('reward-crystal.webp'), 'Кристаллы'],\n    [asset('reward-cup.webp'), 'Кубки'],\n    [asset('reward-cap.webp'), 'Кепки'],\n    [asset('reward-glasses.webp'), 'Очки'],\n    [asset('reward-backpack.webp'), 'Рюкзаки'],", "    [asset('reward-coins.webp'), 'Монетки +100'],\n    [asset('reward-crystal.webp'), 'Кристаллы +5'],\n    [asset('reward-cup.webp'), 'Кубок «Молодец!»'],\n    [asset('reward-cap.webp'), 'Кепка чемпиона'],\n    [asset('reward-glasses.webp'), 'Очки стиля'],\n    [asset('reward-backpack.webp'), 'Рюкзак исследователя'],"),
              ("              <div className=\"inline-flex items-center gap-2 rounded-full border border-violet-100 bg-white/85 px-4 py-2 text-xs font-black text-violet-700 shadow-sm\"><span aria-hidden=\"true\">🐾</span> Английские слова без зубрёжки</div>\n", ""),
              ("AnnWord превращает школьный список слов в короткие игры с питомцем, наградами и прогрессом, который понятен и ребёнку, и родителю.", "AnnWord превращает школьные слова в короткие игры с прогрессом, наградами и радостью каждый день!"),
              ("                <span className=\"text-sm font-black text-slate-500\">Без рекламы · можно начать с одного списка</span>\n", ""),
              ("          <div className=\"mx-auto max-w-3xl text-center\"><div className=\"text-xs font-black uppercase tracking-[0.24em] text-violet-400\">Знакомо?</div><h2 className=\"mt-2 text-2xl font-black text-indigo-950 sm:text-4xl\">Почему обычная зубрёжка не работает</h2></div>", "          <div className=\"mx-auto max-w-3xl text-center\"><h2 className=\"text-2xl font-black text-indigo-950 sm:text-4xl\"><span className=\"mr-2 text-violet-300\" aria-hidden=\"true\">🐾</span>Почему обычная зубрёжка не работает<span className=\"ml-2 text-violet-300\" aria-hidden=\"true\">🐾</span></h2></div>"),
              ("        <section className=\"relative px-4 py-10 sm:px-8 sm:py-14 lg:px-10\">\n          <div className=\"mx-auto max-w-3xl text-center\"><div className=\"text-xs font-black uppercase tracking-[0.24em] text-violet-400\">Три шага</div><h2 className=\"mt-2 text-2xl font-black text-indigo-950 sm:text-4xl\">Что делает AnnWord</h2><p className=\"mt-2 text-sm font-bold text-slate-500 sm:text-base\">От списка слов до понятного результата — без лишней рутины.</p></div>", "        <section id=\"how-it-works\" className=\"relative scroll-mt-24 px-4 py-10 sm:px-8 sm:py-14 lg:px-10\">\n          <div className=\"mx-auto max-w-3xl text-center\"><h2 className=\"text-2xl font-black text-indigo-950 sm:text-4xl\"><span className=\"mr-2 text-violet-300\" aria-hidden=\"true\">🐾</span>Что делает AnnWord<span className=\"ml-2 text-violet-300\" aria-hidden=\"true\">🐾</span></h2></div>"),
              ("        <section className=\"relative border-y border-indigo-50 bg-[linear-gradient(180deg,#f7f5ff_0%,#ffffff_48%,#f5fbff_100%)] px-4 py-10 sm:px-8 sm:py-14 lg:px-10\">\n          <div className=\"mx-auto max-w-3xl text-center\"><div className=\"text-xs font-black uppercase tracking-[0.24em] text-violet-400\">Реальный интерфейс</div><h2 className=\"mt-2 text-2xl font-black text-indigo-950 sm:text-4xl\">Пять игр на одних и тех же словах</h2><p className=\"mt-2 text-sm font-bold text-slate-500 sm:text-base\">Разные механики помогают повторять лексику, не превращая занятие в монотонную проверку.</p></div>", "        <section id=\"game-modes\" className=\"relative scroll-mt-24 border-y border-indigo-50 bg-[linear-gradient(180deg,#f7f5ff_0%,#ffffff_48%,#f5fbff_100%)] px-4 py-10 sm:px-8 sm:py-14 lg:px-10\">\n          <div className=\"mx-auto max-w-3xl text-center\"><h2 className=\"text-2xl font-black text-indigo-950 sm:text-4xl\"><span className=\"mr-2 text-violet-300\" aria-hidden=\"true\">🐾</span>Режимы игры<span className=\"ml-2 text-violet-300\" aria-hidden=\"true\">🐾</span></h2></div>"),
              ("<div><div className=\"text-xs font-black uppercase tracking-[0.22em] text-violet-400\">Питомец растёт вместе с ребёнком</div><h2 className=\"mt-2 text-2xl font-black text-indigo-950 sm:text-3xl\">От малыша до героя</h2></div><div className=\"rounded-2xl bg-white px-4 py-3 text-sm font-black text-violet-700 shadow-sm\">🔥 Серия занятий открывает новые награды</div>", "<div><h2 className=\"text-2xl font-black text-indigo-950 sm:text-3xl\"><span className=\"mr-2 text-violet-300\" aria-hidden=\"true\">🐾</span>Расти вместе с питомцем!</h2></div><div className=\"rounded-2xl bg-white px-4 py-3 text-sm font-black text-violet-700 shadow-sm\">Получи следующую форму за серию дней · 🔥 3 дня подряд!</div>"),
              ("<h2 className=\"text-2xl font-black leading-tight sm:text-3xl\">Награды делают прогресс видимым</h2><p className=\"mt-2 text-sm font-bold leading-relaxed text-indigo-100\">Ребёнок получает понятную обратную связь за усилия и хочет вернуться к словам снова.</p>", "<h2 className=\"text-2xl font-black leading-tight sm:text-3xl\">Играй и получай награды!</h2><p className=\"mt-2 text-sm font-bold leading-relaxed text-indigo-100\">Монеты, кристаллы и вещи для питомца превращают усилия в видимый результат.</p>"),
              ("        <section className=\"px-4 pb-10 sm:px-8 sm:pb-14 lg:px-10\">\n          <div className=\"grid gap-4 lg:grid-cols-2\">", "        <section id=\"for-parents\" className=\"scroll-mt-24 px-4 pb-10 sm:px-8 sm:pb-14 lg:px-10\">\n          <div className=\"grid gap-4 lg:grid-cols-2\">"),
              ("<p className=\"mt-2 text-sm font-bold text-indigo-100\">Без рекламы. Без лишних отвлечений. С прогрессом, который видно.</p>", "<p className=\"mt-2 text-sm font-bold text-indigo-100\">7 дней бесплатно. Карта не требуется.</p>"),
              ("        </section>\n      </main>", "        </section>\n        <div className=\"pb-5 text-center text-xs font-black text-indigo-700 sm:pb-7\"><span className=\"mr-2 text-violet-300\" aria-hidden=\"true\">🐾</span>Безопасно и без рекламы — для вашего спокойствия<span className=\"ml-2 text-violet-300\" aria-hidden=\"true\">🐾</span></div>\n      </main>"),
          ]
          replace_all('components/screens/LandingMixScreen.tsx', landing_replacements)

          header_replacements = [
              ("  const guestTeacherLanding = !isAuthenticated && typeof window !== 'undefined' && (window.location.pathname.replace(/\\/+$/, '') || '/') === '/teacher';", "  const guestTeacherLanding = !isAuthenticated && typeof window !== 'undefined' && (window.location.pathname.replace(/\\/+$/, '') || '/') === '/teacher';\n  const guestParentLanding = !isAuthenticated && !guestTeacherLanding;"),
              ("text-[#121821]", "text-indigo-950"),
              ("{modeLabel !== 'AnnWord' && <span className=\"hidden rounded-full bg-indigo-50 px-3 py-1 text-xs font-black text-indigo-600 sm:inline-flex\">{modeLabel}</span>}", "{guestParentLanding && <span className=\"hidden rounded-md bg-gradient-to-r from-violet-600 to-indigo-600 px-2 py-1 text-xs font-black lowercase text-white shadow-sm sm:inline-flex\">kids</span>}{modeLabel !== 'AnnWord' && <span className=\"hidden rounded-full bg-indigo-50 px-3 py-1 text-xs font-black text-indigo-600 sm:inline-flex\">{modeLabel}</span>}"),
              ("    {navItems.length > 0 && <nav className=\"hidden items-center gap-1 lg:flex\" aria-label=\"Основная навигация\">{navItems.map(item => <button key={item.label} type=\"button\" onClick={item.onClick} aria-current={item.active ? 'page' : undefined} className={`${navButton} ${item.active ? 'bg-indigo-50 text-indigo-700' : 'text-indigo-900'}`}>{item.label}</button>)}</nav>}", "    {navItems.length > 0 && <nav className=\"hidden items-center gap-1 lg:flex\" aria-label=\"Основная навигация\">{navItems.map(item => <button key={item.label} type=\"button\" onClick={item.onClick} aria-current={item.active ? 'page' : undefined} className={`${navButton} ${item.active ? 'bg-indigo-50 text-indigo-700' : 'text-indigo-900'}`}>{item.label}</button>)}</nav>}\n    {guestParentLanding && <nav className=\"hidden items-center gap-1 lg:flex\" aria-label=\"Навигация по AnnWord kids\"><a href=\"/#how-it-works\" className={navButton + ' text-indigo-950'}>Как это работает</a><a href=\"/#game-modes\" className={navButton + ' text-indigo-950'}>Режимы игры</a><a href=\"/#for-parents\" className={navButton + ' text-indigo-950'}>Для родителей</a><a href=\"/premium\" className={navButton + ' text-indigo-950'}>Тарифы</a></nav>}"),
              ("      {!isAuthenticated && <a href={guestTeacherLanding ? '/' : '/teacher'} className=\"hidden rounded-xl px-3 py-2 text-sm font-black text-indigo-700 transition hover:bg-indigo-50 sm:inline-flex\">{guestTeacherLanding ? 'Для родителей' : 'Преподавателям'}</a>}\n      {!isAuthenticated && <button type=\"button\" onClick={onLoginClick} className=\"rounded-xl bg-indigo-600 px-4 py-2 text-sm font-black text-white\">Войти</button>}", "      {!isAuthenticated && !guestParentLanding && <a href={guestTeacherLanding ? '/' : '/teacher'} className=\"hidden rounded-xl px-3 py-2 text-sm font-black text-indigo-700 transition hover:bg-indigo-50 sm:inline-flex\">{guestTeacherLanding ? 'Для родителей' : 'Преподавателям'}</a>}\n      {guestParentLanding && <button type=\"button\" onClick={onLoginClick} className=\"hidden rounded-xl border-2 border-violet-200 bg-white px-4 py-2 text-sm font-black text-violet-700 transition hover:bg-violet-50 sm:inline-flex\">Войти</button>}\n      {guestParentLanding && <a href=\"/kids\" className=\"rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 px-4 py-2 text-sm font-black text-white shadow-lg shadow-indigo-600/20 transition hover:-translate-y-0.5 sm:px-5\">Создать кидс-профиль</a>}\n      {!isAuthenticated && !guestParentLanding && <button type=\"button\" onClick={onLoginClick} className=\"rounded-xl bg-indigo-600 px-4 py-2 text-sm font-black text-white\">Войти</button>}"),
