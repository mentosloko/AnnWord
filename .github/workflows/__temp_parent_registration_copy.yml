name: Temp parent registration copy

on:
  push:
    branches:
      - fix/parent-registration-copy
    paths:
      - .github/workflows/__temp_parent_registration_copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/parent-registration-copy
          fetch-depth: 0
      - name: Apply copy update
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          replace(
              'components/auth/AuthModal.tsx',
              "const title = recoveryMode ? 'Восстановление пароля' : mode === 'login' ? 'Войти в AnnWord' : 'Создать аккаунт';",
              "const title = recoveryMode ? 'Восстановление пароля' : mode === 'login' ? 'Войти в AnnWord' : 'Создать аккаунт родителя';"
          )
          replace(
              'components/auth/AuthModal.tsx',
              '<label className="block"><span className="mb-1 block text-sm font-bold text-slate-700">Электронная почта</span><input ref={emailRef} required type="email" autoComplete="email" value={email} onChange={event => { onEmailChange(event.target.value); setSubmitAttempted(false); }}',
              '<label className="block"><span className="mb-1 block text-sm font-bold text-slate-700">{mode === \'register\' ? \'Электронная почта родителя\' : \'Электронная почта\'}</span><input ref={emailRef} required type="email" autoComplete="email" value={email} onChange={event => { onEmailChange(event.target.value); setSubmitAttempted(false); }}'
          )
          replace(
              'components/screens/LandingMixScreen.tsx',
              '                <p className="max-w-xs text-xs font-bold leading-5 text-slate-500">Аккаунт создаёт родитель · ребёнку отдельная почта не нужна</p>\n',
              ''
          )
          replace(
              'components/screens/FamilySetupScreen.tsx',
              'Вы вошли в аккаунт родителя. Ребёнку отдельная почта не нужна: добавьте его профиль и защитите родительский блок PIN-кодом.',
              'Добавьте ребёнка и защитите родительский блок PIN-кодом.'
          )
          replace(
              'tests/acquisitionFormsIntegrity.test.tsx',
              "expect(screen.getByRole('dialog', { name: 'Создать аккаунт' })).toBeVisible();",
              "expect(screen.getByRole('dialog', { name: 'Создать аккаунт родителя' })).toBeVisible();"
          )
          replace(
              'tests/acquisitionFormsIntegrity.test.tsx',
              "fireEvent.change(screen.getByLabelText('Электронная почта'), { target: { value: 'parent@example.ru' } });",
              "fireEvent.change(screen.getByLabelText('Электронная почта родителя'), { target: { value: 'parent@example.ru' } });"
          )

          test_path = Path('tests/activationP0Regression.test.ts')
          test_text = test_path.read_text()
          pattern = re.compile(r"  it\('makes the parent account model explicit before and during child setup', \(\) => \{.*?\n  \}\);", re.S)
          replacement = """  it('puts the parent account context in registration without duplicating explanatory copy', () => {
            const auth = read('components/auth/AuthModal.tsx');
            const landing = read('components/screens/LandingMixScreen.tsx');
            const familySetup = read('components/screens/FamilySetupScreen.tsx');
            expect(auth).toContain('Создать аккаунт родителя');
            expect(auth).toContain('Электронная почта родителя');
            expect(landing).not.toContain('Аккаунт создаёт родитель · ребёнку отдельная почта не нужна');
            expect(familySetup).not.toContain('Вы вошли в аккаунт родителя. Ребёнку отдельная почта не нужна');
            expect(familySetup).toContain('Добавьте ребёнка и защитите родительский блок PIN-кодом.');
          });"""
          test_text, n = pattern.subn(replacement, test_text, count=1)
          if n != 1:
              raise SystemExit(f'activation regression test block replacements={n}')
          test_path.write_text(test_text)
          PY

          npm ci
          npm run lint
          npx vitest run tests/acquisitionFormsIntegrity.test.tsx tests/activationP0Regression.test.ts
          npm exec -- vite build

      - name: Commit product changes
        shell: bash
        run: |
          rm .github/workflows/__temp_parent_registration_copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clarify parent registration form"
          git push origin HEAD:fix/parent-registration-copy
