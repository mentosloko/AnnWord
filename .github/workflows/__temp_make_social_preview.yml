name: Temporary make AnnWord social preview

on:
  push:
    branches:
      - feat/social-preview-launch
    paths:
      - '.github/workflows/__temp_make_social_preview.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/social-preview-launch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render 1200x630 social preview from AnnWord brand assets
        run: |
          npm install --no-save --no-package-lock sharp@0.34.4
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const sharp = require('sharp');

          const width = 1200;
          const height = 630;
          const heroPath = 'public/assets/landing/annword-hero-boy-pet.svg';
          const logoPath = 'public/assets/branding/annword-logo-mark.svg';
          const outputDir = 'public/social';
          const outputPath = path.join(outputDir, 'annword-og.png');
          fs.mkdirSync(outputDir, { recursive: true });

          const escapeXml = (value) => String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;');

          const overlay = Buffer.from(`
            <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#F8FCFF"/>
                  <stop offset="0.52" stop-color="#F5F1FF"/>
                  <stop offset="1" stop-color="#FFF9EC"/>
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4338CA" flood-opacity="0.12"/>
                </filter>
              </defs>
              <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
              <circle cx="105" cy="540" r="140" fill="#DCFCE7" opacity="0.52"/>
              <circle cx="1110" cy="92" r="128" fill="#E0E7FF" opacity="0.68"/>
              <circle cx="548" cy="70" r="52" fill="#FDE68A" opacity="0.32"/>
              <path d="M508 525C548 487 587 484 625 514" stroke="#C4B5FD" stroke-width="16" stroke-linecap="round" opacity="0.35"/>

              <text x="168" y="112" fill="#121821" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="800">AnnWord</text>
              <text x="72" y="225" fill="#121821" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="800">Школьные слова —</text>
              <text x="72" y="292" fill="#57B84D" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="800">играючи</text>
              <text x="72" y="365" fill="#475569" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600">Игры, питомец и ежедневные задания</text>
              <text x="72" y="400" fill="#475569" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600">для слов, которые задали в школе.</text>

              <g font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">
                <rect x="72" y="465" width="118" height="48" rx="24" fill="#EEF2FF"/>
                <text x="103" y="496" fill="#4338CA">Игры</text>
                <rect x="204" y="465" width="145" height="48" rx="24" fill="#FFF7ED"/>
                <text x="231" y="496" fill="#C2410C">Питомец</text>
                <rect x="363" y="465" width="151" height="48" rx="24" fill="#F0FDF4"/>
                <text x="389" y="496" fill="#15803D">Прогресс</text>
              </g>

              <text x="72" y="575" fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600">annword.ru</text>
            </svg>
          `);

          (async () => {
            const hero = await sharp(heroPath).resize({ width: 585 }).png().toBuffer();
            const logo = await sharp(logoPath).resize({ width: 76, height: 76 }).png().toBuffer();
            await sharp({ create: { width, height, channels: 4, background: '#ffffff' } })
              .composite([
                { input: overlay, left: 0, top: 0 },
                { input: logo, left: 72, top: 54 },
                { input: hero, left: 602, top: 112 },
              ])
              .png({ compressionLevel: 9, adaptiveFiltering: true })
              .toFile(outputPath);

            const meta = await sharp(outputPath).metadata();
            const size = fs.statSync(outputPath).size;
            if (meta.width !== 1200 || meta.height !== 630) throw new Error(`Unexpected dimensions: ${meta.width}x${meta.height}`);
            console.log(`SOCIAL_PREVIEW_REPORT ${JSON.stringify({ outputPath, width: meta.width, height: meta.height, bytes: size })}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit preview and remove temporary workflow
        run: |
          rm .github/workflows/__temp_make_social_preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social/annword-og.png .github/workflows/__temp_make_social_preview.yml
          git commit -m "feat: add AnnWord social preview asset"
          git push origin HEAD:feat/social-preview-launch
