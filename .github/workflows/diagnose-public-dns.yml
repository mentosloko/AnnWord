name: Repair and diagnose Mail.ru DNS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-public-dns.yml'

permissions:
  contents: write
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark DNS repair pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"Mail.ru DNS Repair",description:"Repairing SPF and DKIM TXT records",target_url:process.env.TARGET_URL}))' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null

      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a >/dev/null 2>&1
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > yc-sa-key.json
          yc config profile create annword-mailru-repair >/dev/null
          yc config set service-account-key yc-sa-key.json >/dev/null
          yc config set cloud-id "$YC_CLOUD_ID" >/dev/null
          yc config set folder-id "$YC_FOLDER_ID" >/dev/null

      - name: Repair SPF and DKIM TXT records
        id: repair
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/fix_mailru_txt_records.py 2>&1 | tee dns-repair.txt

      - name: Wait for authoritative DNS
        run: sleep 20

      - name: Query public and authoritative DNS
        run: |
          set -o pipefail
          {
            echo '=== RESOLVER DEFAULT ==='
            dig +short TXT annword.ru
            dig +short MX annword.ru
            dig +short TXT mailru._domainkey.annword.ru
            echo '=== GOOGLE 8.8.8.8 ==='
            dig +short TXT annword.ru @8.8.8.8
            dig +short MX annword.ru @8.8.8.8
            dig +short TXT mailru._domainkey.annword.ru @8.8.8.8
            echo '=== CLOUDFLARE 1.1.1.1 ==='
            dig +short TXT annword.ru @1.1.1.1
            dig +short MX annword.ru @1.1.1.1
            dig +short TXT mailru._domainkey.annword.ru @1.1.1.1
            echo '=== NS ==='
            dig +short NS annword.ru
            for ns in $(dig +short NS annword.ru); do
              echo "=== AUTHORITATIVE $ns ==="
              dig +short TXT annword.ru @$ns
              dig +short MX annword.ru @$ns
              dig +short TXT mailru._domainkey.annword.ru @$ns
            done
          } | tee dns-diagnostic.txt

      - name: Commit diagnostic result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dns-diagnostic.txt dns-repair.txt
          git commit -m "Record Mail.ru DNS repair diagnostic" || exit 0
          git push

      - name: Validate exact public records
        run: |
          test "${{ steps.repair.outcome }}" = "success"
          grep -F '"v=spf1 redirect=_spf.mail.ru"' dns-diagnostic.txt
          grep -F '"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCnk6GAUaz8HY54TiaQaeYA5r++Kn4ixocss6lywM6N7PtB8OfgHgJyfNmXNRcwgeFQKvhATQUKqLTrCVC6gZ2/lWVt/e5wi/j2LIRDQgCT/ME4vJ6gSnBWBKa5b2OU7Otipmt9wPW9hqtraUZHTLm9tuxoqEMjdHqNKSK40rnUCwIDAQAB"' dns-diagnostic.txt

      - name: Publish DNS repair status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; DESCRIPTION='Mail.ru SPF and DKIM are publicly correct'; else STATE=failure; DESCRIPTION='Mail.ru DNS repair failed'; fi
          export STATE DESCRIPTION
          node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"Mail.ru DNS Repair",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null
