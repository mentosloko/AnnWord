name: Apply Spotlight Premium from main

on:
  push:
    branches: [main]
    paths:
      - scripts/run-spotlight-premium.trigger

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-spotlight-premium-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark Spotlight integration pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"Spotlight Integration",description:"Applying and verifying Spotlight Premium",target_url:process.env.TARGET_URL}))' > /tmp/spotlight-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/spotlight-status.json

      - uses: actions/checkout@v4
        with:
          ref: feature/spotlight-premium
          fetch-depth: 0

      - name: Extract Spotlight data and integration patch
        id: apply_patch
        continue-on-error: true
        run: |
          set +e
          : > /tmp/spotlight-apply.log
          {
            set -euo pipefail
            echo "Runtime chunks:"
            wc -c scripts/spotlight-upload/runtime_*.b64
            for file in scripts/spotlight-upload/runtime_*.b64; do
              tr -cd 'A-Za-z0-9+/=' < "$file"
            done | base64 -d > /tmp/spotlight-runtime.tar.xz
            xz -t /tmp/spotlight-runtime.tar.xz
            mkdir -p dictionaries/premium/spotlight
            tar -xJf /tmp/spotlight-runtime.tar.xz -C dictionaries/premium/spotlight
            tr -cd 'A-Za-z0-9+/=' < scripts/spotlight-upload/apply.py.xz.b64 | base64 -d | xz -d > /tmp/apply-spotlight.py
            python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-spotlight.py')
          source = path.read_text(encoding='utf-8')
          start = source.index("bundle_path = ROOT / 'scripts/spotlight-runtime.zip.b64'")
          end = source.index("\n\nwrite('services/premiumDictionaryCatalog.ts'", start)
          path.write_text(source[:start] + source[end + 2:], encoding='utf-8')
          PY
            python3 /tmp/apply-spotlight.py
          } >> /tmp/spotlight-apply.log 2>&1
          STATUS=$?
          cat /tmp/spotlight-apply.log
          exit "$STATUS"

      - name: Save patch diagnostic
        if: steps.apply_patch.outcome == 'failure'
        run: |
          { echo "Spotlight patch failed before verification."; echo; tail -n 240 /tmp/spotlight-apply.log; } > spotlight-integration-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add spotlight-integration-error.txt
          git commit -m "Record Spotlight integration failure"
          git push origin HEAD:feature/spotlight-premium
          exit 1

      - uses: actions/setup-node@v4
        if: steps.apply_patch.outcome == 'success'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.apply_patch.outcome == 'success'
        run: npm install --no-audit --no-fund

      - name: Verify Spotlight integration
        if: steps.apply_patch.outcome == 'success'
        run: |
          npm run lint
          npm run premium-dictionaries:validate
          npm run check:unit
          npm run build

      - name: Commit verified integration to feature branch
        if: steps.apply_patch.outcome == 'success'
        run: |
          rm -rf scripts/spotlight-upload scripts/spotlight-integration.trigger .github/workflows/apply-spotlight-premium.yml spotlight-integration-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Spotlight premium dictionaries"
          git push origin HEAD:feature/spotlight-premium

      - name: Publish Spotlight integration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; DESCRIPTION="Spotlight Premium verified in feature branch"; else STATE=failure; DESCRIPTION="Spotlight Premium integration failed"; fi
          STATE="$STATE" DESCRIPTION="$DESCRIPTION" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"Spotlight Integration",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))' > /tmp/spotlight-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/spotlight-status.json
          test "$STATE" = success
