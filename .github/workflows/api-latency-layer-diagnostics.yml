name: API Latency Layer Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/payment-performance-diagnostics
    paths:
      - '.github/workflows/api-latency-layer-diagnostics.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install and configure Yandex Cloud CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a >/dev/null
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > /tmp/key.json
          "$HOME/yandex-cloud/bin/yc" config profile create api-latency >/dev/null
          "$HOME/yandex-cloud/bin/yc" config set service-account-key /tmp/key.json
          "$HOME/yandex-cloud/bin/yc" config set cloud-id "$YC_CLOUD_ID"
          "$HOME/yandex-cloud/bin/yc" config set folder-id "$YC_FOLDER_ID"

      - name: Correlate API Gateway and container durations
        run: |
          set -euo pipefail
          SINCE="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          UNTIL="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          yc logging read --group-name=default --since="$SINCE" --until="$UNTIL" --limit 5000 --max-response-size 64M --format json > /tmp/logs.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/logs.json','utf8'));
          const rows=Array.isArray(x)?x:(x.entries||x.messages||[]);
          const gateway=new Map(), container=new Map();
          for(const r of rows){
            const p=r.json_payload||r.jsonPayload||{};
            const id=String(p.request_id||p.requestId||'');
            if(!id) continue;
            const resourceType=String(r.resource?.type||'');
            const uri=String(p.request_uri||p.path||'');
            const method=String(p.operation||p.method||'');
            if(resourceType==='serverless.apiGateway' && p.duration_seconds!=null){
              gateway.set(id,{id,uri,method,status:Number(p.code||0),ms:Number(p.duration_seconds)*1000});
            }
            if(resourceType==='serverless.container' && p.event==='http_request' && p.duration_ms!=null){
              container.set(id,{id,uri,method,status:Number(p.status||0),ms:Number(p.duration_ms)});
            }
          }
          const pairs=[];
          for(const [id,g] of gateway){
            const c=container.get(id); if(!c) continue;
            const overhead=Math.max(0,g.ms-c.ms);
            pairs.push({...g,containerMs:c.ms,overheadMs:overhead});
          }
          const pct=(arr,p,key)=>{if(!arr.length)return null;const s=[...arr].sort((a,b)=>a[key]-b[key]);return s[Math.min(s.length-1,Math.ceil(p*s.length)-1)][key]};
          const summarize=(name,arr)=>({name,n:arr.length,gatewayP50:Math.round(pct(arr,.5,'ms')||0),gatewayP95:Math.round(pct(arr,.95,'ms')||0),containerP50:Math.round(pct(arr,.5,'containerMs')||0),containerP95:Math.round(pct(arr,.95,'containerMs')||0),overheadP50:Math.round(pct(arr,.5,'overheadMs')||0),overheadP95:Math.round(pct(arr,.95,'overheadMs')||0)});
          const api=pairs.filter(x=>x.uri.startsWith('/api/'));
          const actual=api.filter(x=>x.method!=='OPTIONS');
          const options=api.filter(x=>x.method==='OPTIONS');
          console.log(JSON.stringify([summarize('all-api',api),summarize('non-options',actual),summarize('options',options)],null,2));
          const routeMap=new Map();
          for(const p of actual){const k=`${p.method} ${p.uri}`;const a=routeMap.get(k)||[];a.push(p);routeMap.set(k,a)}
          const routes=[...routeMap].filter(([,a])=>a.length>=3).map(([name,a])=>summarize(name,a)).sort((a,b)=>b.gatewayP95-a.gatewayP95).slice(0,25);
          console.log('=== routes ==='); console.log(JSON.stringify(routes,null,2));
          console.log('=== slowest gateway overhead pairs ===');
          console.log(JSON.stringify([...api].sort((a,b)=>b.overheadMs-a.overheadMs).slice(0,25).map(x=>({method:x.method,uri:x.uri,status:x.status,gatewayMs:Math.round(x.ms),containerMs:Math.round(x.containerMs),overheadMs:Math.round(x.overheadMs)})),null,2));
          NODE
