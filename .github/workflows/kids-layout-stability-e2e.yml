name: Kids Layout Stability Browser E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - 'components/screens/KidsHomeScreen.tsx'
      - 'components/AuthBootstrapGate.tsx'
      - 'AppV2.tsx'
      - 'e2e/kids-cls-integrity.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/kids-layout-stability-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kids-layout-stability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kids-cls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build browser E2E app
        env:
          VITE_API_URL: http://127.0.0.1:8787
        run: npm run build
      - name: Assert mobile Kids CLS budget
        run: npx playwright test e2e/kids-cls-integrity.spec.ts --project=chromium-desktop
