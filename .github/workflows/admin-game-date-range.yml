name: Verify admin game date range

on:
  push:
    branches: [admin-game-date-range-2026-07-26]
    paths:
      - 'tmp/admin-game-date-range.run'

permissions:
  contents: write
  statuses: write

concurrency:
  group: admin-game-date-range
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_admin_game_date_range.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run check:unit

      - name: Production build
        run: npm run build

      - name: Keep release diff clean
        run: |
          git checkout origin/main -- public/legal/*.pdf
          grep -F "type=\"date\"" components/screens/AdminAnalyticsScreen.tsx
          grep -F "sum(greatest(recorded_starts, finishes))" server/routes/analyticsRoutes.ts
          grep -F "input.eventName === 'game_started'" services/analyticsService.ts

      - name: Commit verified changes
        run: |
          rm -f scripts/apply_admin_game_date_range.py .github/workflows/admin-game-date-range.yml tmp/admin-game-date-range.run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add calendar-filtered game analytics"
          git push
