name: Hero scene A one-shot
on:
  push:
    branches: ["agent/hero-scene-a-prod"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hero-scene-a-prod
          fetch-depth: 0
      - name: Apply changes
        run: python .github/scripts/apply-hero-scene-a.py
      - name: Verify assets
        run: |
          test -f public/assets/landing/final/hero-scene.webp
          test -f public/assets/landing/final/pet-stage-3.webp
          test -f public/assets/landing/final/pet-stage-4.webp
          test -f public/assets/landing/final/cta-mascot.webp
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hero-scene-a-one-shot.yml .github/scripts/apply-hero-scene-a.py
          git add components/screens/LandingMixScreen.tsx
          git commit -m "Use unified hero scene and fix mascot placement"
          git push origin HEAD:agent/hero-scene-a-prod
