name: Temporary Kids regression fixer
on:
  push:
    branches: [agent/review-kids-regression-20260805]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-kids-regression-20260805
      - name: Apply fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          auth = Path('components/auth/AuthModal.tsx')
          text = auth.read_text()
          text = text.replace("import { readRegistrationIntent } from '../../services/registrationIntent';\n", '')
          text = text.replace("  const kidsRegistration = mode === 'register' && readRegistrationIntent()?.accountMode === 'parent';\n", '')
          block = '''        {kidsRegistration && <div className="mt-3 rounded-2xl border-2 border-amber-100 bg-amber-50 p-4">\n          <div className="text-xs font-black uppercase tracking-widest text-amber-600">Первый месяц бесплатно</div>\n          <h3 className="mt-1 text-lg font-black text-indigo-950">Kids Premium включится после подтверждения email</h3>\n          <p className="mt-2 text-sm font-bold leading-5 text-slate-600">Школьные словари по классам и возможность играть по своим словам будут доступны без оплаты в течение первого месяца. Дата окончания сохранится в аккаунте.</p>\n        </div>}\n'''
          if block not in text:
              raise SystemExit('Premium registration block not found')
          auth.write_text(text.replace(block, ''))

          state = Path('services/profileAccessState.ts')
          text = state.read_text()
          addition = '''\nexport const mergeProfileUpdateForOwner = (previousOwnerId: string | null, nextOwnerId: string | null, previous: UserProfile, next: UserProfile): UserProfile => {\n  if (previousOwnerId !== nextOwnerId) return next;\n  return preserveEstablishedAccountAccess(previous, next);\n};\n'''
          if 'mergeProfileUpdateForOwner' not in text:
              state.write_text(text.rstrip() + addition)

          auth_hook = Path('hooks/useAuthProfile.ts')
          text = auth_hook.read_text()
          text = text.replace("import { preserveEstablishedAccountAccess } from '../services/profileAccessState';", "import { mergeProfileUpdateForOwner } from '../services/profileAccessState';")
          old = "  const currentUserIdRef = useRef<string | null>(initialCachedUserId);\n  const setUserProfile = useCallback((next: UserProfile | ((prev: UserProfile) => UserProfile)) => { setUserProfileState(prev => { const resolved = typeof next === 'function' ? (next as (prev: UserProfile) => UserProfile)(prev) : next; const safeProfile = preserveEstablishedAccountAccess(prev, resolved); profileCache.write(safeProfile, currentUserIdRef.current); return safeProfile; }); }, []);"
          new = "  const currentUserIdRef = useRef<string | null>(initialCachedUserId);\n  const profileOwnerUserIdRef = useRef<string | null>(initialCachedUserId);\n  const setUserProfile = useCallback((next: UserProfile | ((prev: UserProfile) => UserProfile)) => { setUserProfileState(prev => { const resolved = typeof next === 'function' ? (next as (prev: UserProfile) => UserProfile)(prev) : next; const safeProfile = mergeProfileUpdateForOwner(profileOwnerUserIdRef.current, currentUserIdRef.current, prev, resolved); profileOwnerUserIdRef.current = currentUserIdRef.current; profileCache.write(safeProfile, currentUserIdRef.current); return safeProfile; }); }, []);"
          if old not in text:
              raise SystemExit('setUserProfile block not found')
          text = text.replace(old, new)
          text = text.replace("  const resetToGuest = useCallback(() => { currentUserIdRef.current = null; setCachedUserId(null); setCurrentUser(null); profileCache.clear(); setUserProfileState(GUEST_PROFILE); setSettings(createInitialSettings()); }, []);", "  const resetToGuest = useCallback(() => { currentUserIdRef.current = null; profileOwnerUserIdRef.current = null; setCachedUserId(null); setCurrentUser(null); profileCache.clear(); setUserProfileState(GUEST_PROFILE); setSettings(createInitialSettings()); }, []);")
          text = text.replace("  const loadProfileForUser = useCallback(async (user: User) => { const { userService } = await import('../services/userService'); const profile = await userService.getOrCreateProfile(user.id, user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'Пользователь', user.email || undefined); profileCache.write(profile, user.id); setUserProfile(profile); setSettings(prev => ({ ...prev, ...readStoredSettings(user.id), username: profile.username })); }, [setUserProfile]);", "  const loadProfileForUser = useCallback(async (user: User) => { currentUserIdRef.current = user.id; const { userService } = await import('../services/userService'); const profile = await userService.getOrCreateProfile(user.id, user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'Пользователь', user.email || undefined); setUserProfile(profile); setSettings(prev => ({ ...prev, ...readStoredSettings(user.id), username: profile.username })); }, [setUserProfile]);")
          old_fresh = "if (isFreshLogin) { await loadProfileForUser(user); if (cancelled) return; currentUserIdRef.current = user.id; setCachedUserId(user.id); setCurrentUser(user); return; }"
          new_fresh = "if (isFreshLogin) { currentUserIdRef.current = user.id; await loadProfileForUser(user); if (cancelled) return; setCachedUserId(user.id); setCurrentUser(user); return; }"
          if old_fresh not in text:
              raise SystemExit('fresh login block not found')
          auth_hook.write_text(text.replace(old_fresh, new_fresh))

          tests = Path('tests/profileAccessState.test.ts')
          text = tests.read_text().replace("import { preserveEstablishedAccountAccess } from '../services/profileAccessState';", "import { mergeProfileUpdateForOwner, preserveEstablishedAccountAccess } from '../services/profileAccessState';")
          marker = "  it('never sends a completed character back to onboarding when an older response arrives', () => {"
          test = '''  it('does not carry onboarding state between different accounts on the same device', () => {\n    const previous = profile({ childDisplayName: 'Анна', childShareCode: 'ABC12345', pet: { ...profile().pet, characterOnboarded: true, name: 'Рэй' } });\n    const newAccount = profile({ username: 'new-user', childDisplayName: undefined, childShareCode: undefined, pet: { ...profile().pet, characterOnboarded: false, name: 'Щенок' } });\n    const merged = mergeProfileUpdateForOwner('old-user-id', 'new-user-id', previous, newAccount);\n    expect(merged.childDisplayName).toBeUndefined();\n    expect(merged.childShareCode).toBeUndefined();\n    expect(merged.pet.characterOnboarded).toBe(false);\n  });\n\n'''
          if test not in text:
              text = text.replace(marker, test + marker)
          tests.write_text(text)

          regression = Path('tests/kidsOnboardingSystemRegression.test.ts')
          text = regression.read_text()
          text = text.replace("    expect(authModal).toContain('Первый месяц бесплатно');\n    expect(authModal).toContain('Kids Premium включится после подтверждения email');", "    expect(authModal).not.toContain('Первый месяц бесплатно');\n    expect(authModal).not.toContain('Kids Premium включится после подтверждения email');")
          identity_test = "    expect(read('hooks/useAuthProfile.ts')).toContain('mergeProfileUpdateForOwner(profileOwnerUserIdRef.current, currentUserIdRef.current');\n"
          anchor = "    expect(overlay).toContain('registrationEntryPathForMode(accountMode)');\n"
          if identity_test not in text:
              text = text.replace(anchor, anchor + identity_test)
          regression.write_text(text)
          PY
          rm .github/workflows/tmp-review-kids-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Kids registration regression and account state leakage'
          git push origin HEAD:agent/review-kids-regression-20260805
