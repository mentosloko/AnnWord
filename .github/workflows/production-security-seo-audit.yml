name: Production Security SEO Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy to Yandex Cloud
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-security-seo-audit
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  APP_ORIGIN: https://annword.ru
  WWW_ORIGIN: https://www.annword.ru

jobs:
  audit:
    name: Verify security SEO and routing evidence
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify canonical frontend headers
        run: |
          set -euo pipefail
          curl -fsSI "$APP_ORIGIN/" | tr -d '\r' > /tmp/root-headers.txt
          cat /tmp/root-headers.txt
          grep -Eqi '^strict-transport-security:[[:space:]]*max-age=' /tmp/root-headers.txt
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' /tmp/root-headers.txt

      - name: Verify SEO documents and root metadata
        run: |
          set -euo pipefail
          curl -fsS "$APP_ORIGIN/" > /tmp/root.html
          grep -Fq 'rel="canonical" href="https://annword.ru/"' /tmp/root.html
          grep -Fq 'name="referrer" content="strict-origin-when-cross-origin"' /tmp/root.html
          grep -Fq 'property="og:title"' /tmp/root.html
          grep -Fq 'name="twitter:card"' /tmp/root.html
          grep -Fq 'http-equiv="Content-Security-Policy"' /tmp/root.html
          grep -Fq 'https://cdn.jsdelivr.net' /tmp/root.html
          grep -Fq 'https://tessdata.projectnaptha.com' /tmp/root.html
          grep -Fq 'worker-src' /tmp/root.html
          curl -fsS "$APP_ORIGIN/robots.txt" | tee /tmp/robots.txt
          grep -Fq 'Sitemap: https://annword.ru/sitemap.xml' /tmp/robots.txt
          curl -fsS "$APP_ORIGIN/sitemap.xml" | tee /tmp/sitemap.xml
          grep -Fq '<loc>https://annword.ru/</loc>' /tmp/sitemap.xml

      - name: Verify crawler-visible public route metadata
        run: |
          set -euo pipefail
          curl -fsS "$APP_ORIGIN/kids/" > /tmp/kids.html
          grep -Fq '<title>AnnWord Kids — школьные английские слова играючи</title>' /tmp/kids.html
          grep -Fq 'rel="canonical" href="https://annword.ru/kids/"' /tmp/kids.html
          grep -Fq 'property="og:url" content="https://annword.ru/kids/"' /tmp/kids.html

          curl -fsS "$APP_ORIGIN/teacher/" > /tmp/teacher.html
          grep -Fq '<title>AnnWord для преподавателей английского</title>' /tmp/teacher.html
          grep -Fq 'rel="canonical" href="https://annword.ru/teacher/"' /tmp/teacher.html
          grep -Fq 'property="og:url" content="https://annword.ru/teacher/"' /tmp/teacher.html

          curl -fsS "$APP_ORIGIN/practice/" > /tmp/practice.html
          grep -Fq '<title>AnnWord Practice — тренировка английских слов</title>' /tmp/practice.html
          grep -Fq 'rel="canonical" href="https://annword.ru/practice/"' /tmp/practice.html
          grep -Fq 'property="og:url" content="https://annword.ru/practice/"' /tmp/practice.html

      - name: Verify server-side 404 status and metadata
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/not-found.html -w '%{http_code}' "$APP_ORIGIN/__annword_missing_route_probe__")"
          echo "Unknown route HTTP status: $STATUS"
          test "$STATUS" = "404"
          grep -Fq '<title>Страница не найдена — AnnWord</title>' /tmp/not-found.html
          grep -Fq 'name="robots" content="noindex,nofollow"' /tmp/not-found.html

      - name: Inspect response CSP frame protection
        run: |
          set -euo pipefail
          CSP="$(curl -sSI "$APP_ORIGIN/" | tr -d '\r' | sed -n 's/^content-security-policy:[[:space:]]*//Ip' | head -n 1)"
          echo "Response CSP: ${CSP:-missing}"
          if [ -n "$CSP" ] && printf '%s' "$CSP" | grep -Eqi "frame-ancestors[[:space:]]+'none'|frame-ancestors[[:space:]]+'self'"; then
            echo 'FRAME_ANCESTORS_READY=1' >> "$GITHUB_ENV"
          else
            echo 'FRAME_ANCESTORS_READY=0' >> "$GITHUB_ENV"
          fi

      - name: Inspect www canonical redirect
        run: |
          set -euo pipefail
          curl -sSI "$WWW_ORIGIN/" | tr -d '\r' > /tmp/www-headers.txt || true
          cat /tmp/www-headers.txt
          STATUS="$(sed -n '1s#^HTTP/[^ ]* \([0-9][0-9][0-9]\).*#\1#p' /tmp/www-headers.txt)"
          LOCATION="$(sed -n 's/^location:[[:space:]]*//Ip' /tmp/www-headers.txt | head -n 1)"
          echo "www status=${STATUS:-unreachable}; location=${LOCATION:-none}"
          if printf '%s' "$STATUS" | grep -Eq '^30[1278]$' && [ "$LOCATION" = 'https://annword.ru/' ]; then
            echo 'WWW_REDIRECT_READY=1' >> "$GITHUB_ENV"
          else
            echo 'WWW_REDIRECT_READY=0' >> "$GITHUB_ENV"
          fi

      - name: Summarize response-only blockers
        run: |
          {
            echo '## Security / SEO response evidence'
            echo "- HSTS: verified"
            echo "- X-Content-Type-Options: verified"
            echo "- Public route metadata: crawler-visible HTML verified"
            echo "- OCR CSP dependencies: preserved"
            echo "- Server-side unknown route: HTTP 404 + noindex metadata verified"
            echo "- CSP frame-ancestors response directive: ${FRAME_ANCESTORS_READY}"
            echo "- www -> canonical 301/302/307/308: ${WWW_REDIRECT_READY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          STATE=success
          DESCRIPTION='Security, SEO and 404 production evidence collected'
          if [ "$JOB_STATUS" != success ]; then
            STATE=failure
            DESCRIPTION='Security/SEO production audit failed'
          fi
          export STATE DESCRIPTION
          node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"Security SEO Audit",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))' > /tmp/security-seo-status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            --data-binary @/tmp/security-seo-status.json
