name: Production Security SEO Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy to Yandex Cloud
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-security-seo-audit
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  APP_ORIGIN: https://annword.ru
  WWW_ORIGIN: https://www.annword.ru

jobs:
  audit:
    name: Verify security SEO and routing evidence
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect complete production evidence
        run: |
          set -u -o pipefail

          CODE_EVIDENCE_READY=1
          HSTS_READY=0
          NOSNIFF_READY=0
          FRAME_ANCESTORS_READY=0
          WWW_REDIRECT_READY=0

          record_file_contains() {
            local label="$1"
            local needle="$2"
            local file="$3"
            if grep -Fq "$needle" "$file" 2>/dev/null; then
              echo "PASS: $label"
            else
              echo "FAIL: $label"
              CODE_EVIDENCE_READY=0
            fi
          }

          record_header_regex() {
            local label="$1"
            local regex="$2"
            local file="$3"
            if grep -Eqi "$regex" "$file" 2>/dev/null; then
              echo "PASS: $label"
              return 0
            fi
            echo "MISSING: $label"
            return 1
          }

          fetch_code_url() {
            local label="$1"
            local url="$2"
            local file="$3"
            if curl -fsS "$url" > "$file"; then
              echo "PASS: HTTP $label"
            else
              echo "FAIL: HTTP $label"
              CODE_EVIDENCE_READY=0
              : > "$file"
            fi
          }

          curl -sSI "$APP_ORIGIN/" | tr -d '\r' > /tmp/root-headers.txt || true
          fetch_code_url 'root' "$APP_ORIGIN/" /tmp/root.html
          cat /tmp/root-headers.txt

          if record_header_regex 'HSTS response header' '^strict-transport-security:[[:space:]]*max-age=' /tmp/root-headers.txt; then HSTS_READY=1; fi
          if record_header_regex 'X-Content-Type-Options response header' '^x-content-type-options:[[:space:]]*nosniff' /tmp/root-headers.txt; then NOSNIFF_READY=1; fi

          record_file_contains 'root canonical' 'rel="canonical" href="https://annword.ru/"' /tmp/root.html
          record_file_contains 'privacy referrer policy' 'name="referrer" content="strict-origin-when-cross-origin"' /tmp/root.html
          record_file_contains 'Open Graph metadata' 'property="og:title"' /tmp/root.html
          record_file_contains 'Twitter metadata' 'name="twitter:card"' /tmp/root.html
          record_file_contains 'browser CSP baseline' 'http-equiv="Content-Security-Policy"' /tmp/root.html
          record_file_contains 'OCR jsdelivr CSP dependency' 'https://cdn.jsdelivr.net' /tmp/root.html
          record_file_contains 'OCR tessdata CSP dependency' 'https://tessdata.projectnaptha.com' /tmp/root.html
          record_file_contains 'worker CSP directive' 'worker-src' /tmp/root.html

          fetch_code_url 'robots.txt' "$APP_ORIGIN/robots.txt" /tmp/robots.txt
          fetch_code_url 'sitemap.xml' "$APP_ORIGIN/sitemap.xml" /tmp/sitemap.xml
          record_file_contains 'robots sitemap declaration' 'Sitemap: https://annword.ru/sitemap.xml' /tmp/robots.txt
          record_file_contains 'sitemap canonical root' '<loc>https://annword.ru/</loc>' /tmp/sitemap.xml

          fetch_code_url 'Kids route' "$APP_ORIGIN/kids/" /tmp/kids.html
          record_file_contains 'Kids route title' '<title>AnnWord Kids — школьные английские слова играючи</title>' /tmp/kids.html
          record_file_contains 'Kids route canonical' 'rel="canonical" href="https://annword.ru/kids/"' /tmp/kids.html
          record_file_contains 'Kids Open Graph URL' 'property="og:url" content="https://annword.ru/kids/"' /tmp/kids.html

          fetch_code_url 'Teacher route' "$APP_ORIGIN/teacher/" /tmp/teacher.html
          record_file_contains 'Teacher route title' '<title>AnnWord для преподавателей английского</title>' /tmp/teacher.html
          record_file_contains 'Teacher route canonical' 'rel="canonical" href="https://annword.ru/teacher/"' /tmp/teacher.html
          record_file_contains 'Teacher Open Graph URL' 'property="og:url" content="https://annword.ru/teacher/"' /tmp/teacher.html

          fetch_code_url 'Practice route' "$APP_ORIGIN/practice/" /tmp/practice.html
          record_file_contains 'Practice route title' '<title>AnnWord Practice — тренировка английских слов</title>' /tmp/practice.html
          record_file_contains 'Practice route canonical' 'rel="canonical" href="https://annword.ru/practice/"' /tmp/practice.html
          record_file_contains 'Practice Open Graph URL' 'property="og:url" content="https://annword.ru/practice/"' /tmp/practice.html

          STATUS="$(curl -sS -o /tmp/not-found.html -w '%{http_code}' "$APP_ORIGIN/__annword_missing_route_probe__" || true)"
          echo "Unknown route HTTP status: ${STATUS:-unreachable}"
          if [ "$STATUS" != '404' ]; then CODE_EVIDENCE_READY=0; fi
          record_file_contains '404 title' '<title>Страница не найдена — AnnWord</title>' /tmp/not-found.html
          record_file_contains '404 noindex metadata' 'name="robots" content="noindex,nofollow"' /tmp/not-found.html

          RESPONSE_CSP="$(sed -n 's/^content-security-policy:[[:space:]]*//Ip' /tmp/root-headers.txt | head -n 1)"
          echo "Response CSP: ${RESPONSE_CSP:-missing}"
          if [ -n "$RESPONSE_CSP" ] && printf '%s' "$RESPONSE_CSP" | grep -Eqi "frame-ancestors[[:space:]]+'none'|frame-ancestors[[:space:]]+'self'"; then
            FRAME_ANCESTORS_READY=1
          fi

          curl -sSI "$WWW_ORIGIN/" | tr -d '\r' > /tmp/www-headers.txt || true
          cat /tmp/www-headers.txt
          WWW_STATUS="$(sed -n '1s#^HTTP/[^ ]* \([0-9][0-9][0-9]\).*#\1#p' /tmp/www-headers.txt)"
          WWW_LOCATION="$(sed -n 's/^location:[[:space:]]*//Ip' /tmp/www-headers.txt | head -n 1)"
          echo "www status=${WWW_STATUS:-unreachable}; location=${WWW_LOCATION:-none}"
          if printf '%s' "$WWW_STATUS" | grep -Eq '^30[1278]$' && [ "$WWW_LOCATION" = 'https://annword.ru/' ]; then
            WWW_REDIRECT_READY=1
          fi

          {
            echo "CODE_EVIDENCE_READY=$CODE_EVIDENCE_READY"
            echo "HSTS_READY=$HSTS_READY"
            echo "NOSNIFF_READY=$NOSNIFF_READY"
            echo "FRAME_ANCESTORS_READY=$FRAME_ANCESTORS_READY"
            echo "WWW_REDIRECT_READY=$WWW_REDIRECT_READY"
          } >> "$GITHUB_ENV"

      - name: Summarize code evidence and response-only blockers
        if: always()
        run: |
          {
            echo '## Security / SEO production evidence'
            echo "- Code-addressable SEO/routing evidence: ${CODE_EVIDENCE_READY:-0}"
            echo "- HSTS response header: ${HSTS_READY:-0}"
            echo "- X-Content-Type-Options nosniff response header: ${NOSNIFF_READY:-0}"
            echo "- CSP frame-ancestors response directive: ${FRAME_ANCESTORS_READY:-0}"
            echo "- www -> canonical redirect: ${WWW_REDIRECT_READY:-0}"
            echo '- Response-only zeros are infrastructure/routing blockers and are reported without mutating Yandex settings.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require code-addressable production evidence
        run: |
          set -euo pipefail
          test "${CODE_EVIDENCE_READY:-0}" = '1'

      - name: Publish audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          STATE=success
          DESCRIPTION='Security/SEO code evidence passed; response blockers reported'
          if [ "$JOB_STATUS" != success ]; then
            STATE=failure
            DESCRIPTION='Security/SEO code production evidence failed'
          fi
          export STATE DESCRIPTION
          node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"Security SEO Audit",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))' > /tmp/security-seo-status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            --data-binary @/tmp/security-seo-status.json
