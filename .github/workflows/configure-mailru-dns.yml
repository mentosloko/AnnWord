name: Configure Mail.ru DNS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/configure-mailru-dns.yml'

permissions:
  contents: read
  statuses: write

jobs:
  configure:
    name: Mail.ru DNS Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mark DNS setup pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"Mail.ru DNS",description:"Checking and configuring MX/SPF",target_url:process.env.TARGET_URL}))' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a >/dev/null 2>&1
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > yc-sa-key.json
          yc config profile create annword-mailru-dns >/dev/null
          yc config set service-account-key yc-sa-key.json >/dev/null
          yc config set cloud-id "$YC_CLOUD_ID" >/dev/null
          yc config set folder-id "$YC_FOLDER_ID" >/dev/null

      - name: Configure Mail.ru MX and SPF
        id: configure
        run: |
          set -o pipefail
          printf '%s' '' | base64 -d > /tmp/configure-mailru-dns.py
          python3 /tmp/configure-mailru-dns.py | tee /tmp/dns-output.txt

      - name: Publish DNS setup status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DESCRIPTION="$(grep '^RESULT=' /tmp/dns-output.txt 2>/dev/null | tail -n 1 | sed 's/^RESULT=//' | cut -c1-130)"
          [ -n "$DESCRIPTION" ] || DESCRIPTION="Mail.ru DNS setup failed"
          if printf '%s' "$DESCRIPTION" | grep -q '^SUCCESS'; then STATE="success"; else STATE="failure"; fi
          export STATE DESCRIPTION
          node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"Mail.ru DNS",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null
