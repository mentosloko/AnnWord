name: Configure Mail.ru DNS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/configure-mailru-dns.yml'

permissions:
  contents: read
  statuses: write

jobs:
  configure:
    name: Mail.ru DNS Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mark DNS setup pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"Mail.ru DNS",description:"Checking DNS management access",target_url:process.env.TARGET_URL}))' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a >/dev/null 2>&1
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > yc-sa-key.json
          yc config profile create annword-mailru-dns >/dev/null
          yc config set service-account-key yc-sa-key.json >/dev/null
          yc config set cloud-id "$YC_CLOUD_ID" >/dev/null
          yc config set folder-id "$YC_FOLDER_ID" >/dev/null

      - name: Configure Mail.ru MX and SPF
        run: |
          set -euo pipefail
          if ! yc dns zone list --format json > /tmp/dns-zones.json 2>/tmp/dns-error.txt; then
            ERROR="$(tr '\n' ' ' < /tmp/dns-error.txt | cut -c1-105)"
            printf 'Cloud DNS access failed: %s' "$ERROR" > /tmp/dns-result.txt
            echo "::error::$(cat /tmp/dns-result.txt)"
            exit 3
          fi

          ZONE_ID="$(jq -r '.[] | select(.zone == "annword.ru.") | .id' /tmp/dns-zones.json | head -n 1)"
          if [ -z "$ZONE_ID" ]; then
            printf 'DNS zone annword.ru is not in Yandex Cloud' > /tmp/dns-result.txt
            echo "::error::$(cat /tmp/dns-result.txt)"
            exit 2
          fi

          export ZONE_ID
          yc dns zone list-records "$ZONE_ID" --format json > /tmp/dns-records-before.json

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          zone_id = os.environ['ZONE_ID']
          domain = 'annword.ru.'
          records = json.load(open('/tmp/dns-records-before.json', encoding='utf-8'))
          root_txt = next((record for record in records if record.get('name') == domain and record.get('type') == 'TXT'), None)
          ttl = int((root_txt or {}).get('ttl') or 600)
          original_values = list((root_txt or {}).get('data') or [])

          def plain(value: str) -> str:
              value = value.strip()
              return value[1:-1] if len(value) >= 2 and value[0] == value[-1] == '"' else value

          spf_values = [plain(value) for value in original_values if plain(value).lower().startswith('v=spf1')]
          if len(spf_values) > 1:
              raise SystemExit('Multiple SPF records found; refusing automatic change.')

          if spf_values:
              spf = spf_values[0].strip()
              if 'redirect=_spf.mail.ru' not in spf.lower():
                  spf = re.sub(r'\s+[+?~-]?all\s*$', '', spf, flags=re.IGNORECASE).strip()
                  spf = f'{spf} redirect=_spf.mail.ru'
          else:
              spf = 'v=spf1 redirect=_spf.mail.ru'

          txt_values = [value for value in original_values if not plain(value).lower().startswith('v=spf1')] + [spf]
          txt_command = ['yc', 'dns', 'zone', 'replace-records', zone_id]
          for value in txt_values:
              txt_command.extend(['--record', f'{domain} {ttl} TXT {value}'])
          subprocess.run(txt_command, check=True)
          subprocess.run(['yc', 'dns', 'zone', 'replace-records', zone_id, '--record', f'{domain} 600 MX 10 emx.mail.ru.'], check=True)
          open('/tmp/dns-result.txt', 'w', encoding='utf-8').write('Mail.ru MX and SPF configured in Yandex Cloud')
          PY

          yc dns zone list-records "$ZONE_ID" --record-name annword.ru. --format json > /tmp/dns-records-after.json
          jq -e '.[] | select(.name == "annword.ru." and .type == "MX") | .data[] | select(. == "10 emx.mail.ru.")' /tmp/dns-records-after.json >/dev/null
          jq -e '.[] | select(.name == "annword.ru." and .type == "TXT") | .data[] | select(test("redirect=_spf.mail.ru"; "i"))' /tmp/dns-records-after.json >/dev/null

      - name: Publish DNS setup status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DESCRIPTION="$(cat /tmp/dns-result.txt 2>/dev/null || printf 'Mail.ru DNS setup failed')"
          DESCRIPTION="$(printf '%s' "$DESCRIPTION" | cut -c1-130)"
          if [ "$JOB_STATUS" = "success" ]; then STATE="success"; else STATE="failure"; fi
          export STATE DESCRIPTION
          node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"Mail.ru DNS",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data-binary @/tmp/status.json >/dev/null
