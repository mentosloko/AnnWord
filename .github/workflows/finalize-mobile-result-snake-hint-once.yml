name: Finalize mobile result and Snake hint fix once

on:
  push:
    branches:
      - fix/mobile-result-snake-hint-v2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-result-snake-hint-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire shared one-coin hint charge into Snake
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/AppScreens.tsx')
          text = p.read_text()
          old = 'onGameReward={onGameReward} onWordPractice={onWordPractice} onBack={goHome} /></GameModeShell>,'
          new = 'onGameReward={onGameReward} onWordPractice={onWordPractice} onHintCharge={onDictionaryPeek} onBack={goHome} /></GameModeShell>,'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Snake wiring target, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression tests
        run: npx vitest run tests/letterSquareHintEconomy.test.tsx tests/userReportedUxRegression.test.ts
      - name: TypeScript diagnostics
        run: npm run lint
      - name: Commit wiring and remove one-time workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-mobile-result-snake-hint-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AppScreens.tsx
          git commit -m "fix: wire Snake hint to shared coin economy"
          git push origin HEAD:fix/mobile-result-snake-hint-v2
