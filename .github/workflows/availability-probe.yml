name: Availability Probe

on:
  push:
    branches:
      - ops/availability-probe-20261009
    paths:
      - .github/workflows/availability-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe AnnWord production
        shell: bash
        run: |
          set -u -o pipefail

          echo "=== DNS ==="
          getent ahostsv4 annword.ru || true
          getent ahostsv4 api.annword.ru || true

          probe() {
            local label="$1"
            local url="$2"
            local body="/tmp/$(echo "$label" | tr ' /' '__').body"
            local headers="/tmp/$(echo "$label" | tr ' /' '__').headers"
            echo
            echo "=== $label: $url ==="
            set +e
            stats="$(curl --silent --show-error --location --max-time 20               --output "$body" --dump-header "$headers"               --write-out 'http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} ip=%{remote_ip}'               "$url" 2>&1)"
            exit_code=$?
            set -e
            echo "curl_exit=$exit_code $stats"
            sed -n '1,12p' "$headers" 2>/dev/null | tr -d '\r' || true
            echo "body:"
            head -c 500 "$body" 2>/dev/null || true
            echo
            return $exit_code
          }

          failures=0
          probe "frontend-root" "https://annword.ru/" || failures=$((failures+1))
          probe "frontend-release" "https://annword.ru/release.json" || failures=$((failures+1))
          probe "api-health" "https://api.annword.ru/api/health" || failures=$((failures+1))
          probe "api-db-health" "https://api.annword.ru/api/health/db" || failures=$((failures+1))

          echo
          echo "transport_failures=$failures"
          test "$failures" -eq 0
