name: Apply Kids patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-kids-onboarding-patch
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/kids-onboarding-mobile-20260805' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kids-onboarding-mobile-20260805
      - name: Verify and apply patch
        run: |
          set -euo pipefail
          cat \
            .ops/kids-patch.part00 \
            .ops/kids-patch.part01 \
            .ops/kids-patch.part02 \
            .ops/kids-patch.part03a \
            .ops/kids-patch.part03b \
            .ops/kids-patch.part03c \
            .ops/kids-patch.rem00 \
            .ops/kids-patch.rem01 \
            .ops/kids-patch.rem02 \
            .ops/kids-patch.rem03 \
            .ops/kids-patch.rem04 \
            .ops/kids-patch.rem05 \
            .ops/kids-patch.rem06 \
            .ops/kids-patch.rem07 \
            .ops/kids-patch.rem08 \
            > /tmp/kids-patch.b64
          test "$(wc -c < /tmp/kids-patch.b64)" -eq 122192
          base64 -d /tmp/kids-patch.b64 > /tmp/kids-patch.tar.gz
          echo 'bccfcec6dbabbb1a029a3055a8ced14088a2b54800fb46558b42d96837be1778  /tmp/kids-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/kids-patch.tar.gz -C .
          rm -rf .ops
          rm -f .github/workflows/agent-repo-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Kids onboarding and mobile dictionary fixes'
          git push origin HEAD:agent/kids-onboarding-mobile-20260805
