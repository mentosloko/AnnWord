name: Agent repository snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ github.head_ref == 'agent/kids-onboarding-mobile-20260805' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/annword-repository.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: annword-repository-snapshot
          path: /tmp/annword-repository.tar.gz
          retention-days: 1
