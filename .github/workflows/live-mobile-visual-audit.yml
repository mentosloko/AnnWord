name: Live mobile visual audit
on:
  push:
    branches:
      - agent/live-landing-perf-audit
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture live mobile viewport screenshots
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          await page.goto('https://annword.ru/', { waitUntil: 'networkidle', timeout: 60000 });
          const targets = [
            ['hero', 'Снова задали'],
            ['steps', 'Что делает AnnWord'],
            ['pet', 'Расти вместе с питомцем!'],
            ['rewards', 'Играй и получай награды!'],
            ['child', 'Польза для ребёнка'],
            ['parents', 'Польза для родителей'],
          ];
          for (const [name, text] of targets) {
            const target = page.getByText(text, { exact: false }).first();
            await target.scrollIntoViewIfNeeded();
            await page.waitForTimeout(1500);
            console.log(name, await page.evaluate(() => [...document.images]
              .filter(img => { const r = img.getBoundingClientRect(); return r.bottom > -200 && r.top < innerHeight + 200; })
              .map(img => ({alt: img.alt, src: img.currentSrc || img.src, complete: img.complete, nw: img.naturalWidth, nh: img.naturalHeight, rect: img.getBoundingClientRect().toJSON()}))));
            await page.screenshot({ path: `/tmp/${name}.png` });
          }
          console.log('layout', await page.evaluate(() => ({scrollWidth: document.documentElement.scrollWidth, innerWidth, bodyHeight: document.body.scrollHeight})));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: live-mobile-viewport-diagnostics
          path: /tmp/*.png
          retention-days: 1
