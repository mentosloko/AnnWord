name: Temporary audit daily world lossless variants

on:
  push:
    branches:
      - perf/responsive-daily-world-backgrounds

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/responsive-daily-world-backgrounds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure lossless responsive variants
        run: |
          npm install --no-save --no-package-lock sharp@0.34.4
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const sharp = require('sharp');
          const dir = 'public/assets/rooms/daily';
          const names = ['theatre', 'amusement-park', 'ice-rink', 'opera', 'sausage-fridge'];
          const widths = [960, 1440];
          (async () => {
            for (const name of names) {
              const source = path.join(dir, `${name}.webp`);
              const sourceBytes = fs.statSync(source).size;
              console.log(`${name}: source ${sourceBytes} bytes`);
              for (const width of widths) {
                const target = path.join(os.tmpdir(), `${name}-${width}-lossless.webp`);
                await sharp(source)
                  .resize({ width, withoutEnlargement: true, kernel: sharp.kernel.lanczos3 })
                  .webp({ lossless: true, effort: 6 })
                  .toFile(target);
                const outBytes = fs.statSync(target).size;
                console.log(`  ${width} lossless: ${outBytes} bytes (${(100 * outBytes / sourceBytes).toFixed(1)}% of source)`);
              }
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Remove temporary audit workflow
        run: |
          rm .github/workflows/__temp_audit_daily_world_lossless.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/__temp_audit_daily_world_lossless.yml
          git commit -m "chore: remove one-off lossless audit workflow"
          git push origin HEAD:perf/responsive-daily-world-backgrounds
