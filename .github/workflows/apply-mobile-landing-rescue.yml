name: Apply mobile landing rescue
on:
  push:
    branches:
      - agent/mobile-landing-rescue
jobs:
  apply:
    if: github.event.head_commit.message == 'Add temporary mobile landing rescue workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch responsive landing and restore valid assets
        run: |
          python3 scripts/mobile_landing_rescue.py
          git checkout b08266d627e89c4269dcfccd982d077d983f721c -- public/assets/landing/final/pet-stage-4.webp
          git checkout 6f4e117b80aec094d1caa2c7ce19589e44213d06 -- public/assets/landing/final/cta-mascot.webp
          rm scripts/mobile_landing_rescue.py .github/workflows/apply-mobile-landing-rescue.yml
      - name: Commit rescue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile landing composition"
          git push origin HEAD:agent/mobile-landing-rescue
