name: Pet reward polish one-shot

on:
  push:
    branches:
      - agent/pet-reward-polish

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pet-reward-polish
          fetch-depth: 0
      - name: Apply landing polish
        run: python scripts/apply_pet_reward_polish.py
      - name: Verify result
        run: |
          test -f public/assets/landing/final/pet-stage-1.webp
          test -f public/assets/landing/final/pet-stage-2.webp
          test -f public/assets/landing/final/cta-mascot.webp
          grep -q "scale-\[0.78\]" components/screens/LandingMixScreen.tsx
          grep -q "Питомец AnnWord летит за наградами" components/screens/LandingMixScreen.tsx
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pet-reward-polish-one-shot.yml scripts/apply_pet_reward_polish.py
          git add components/screens/LandingMixScreen.tsx
          git commit -m "Polish pet stages and reward mascot"
          git push origin HEAD:agent/pet-reward-polish
