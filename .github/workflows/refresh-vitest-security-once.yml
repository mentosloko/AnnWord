name: Refresh Vitest security dependency once

on:
  push:
    branches:
      - fix/mobile-result-snake-hint-v2

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-result-snake-hint-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh Vitest to patched major
        run: npm install --save-dev vitest@^5.0.0 @vitest/coverage-v8@^5.0.0
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: TypeScript diagnostics
        run: npm run lint
      - name: Focused regression tests
        run: npx vitest run tests/letterSquareHintEconomy.test.tsx tests/userReportedUxRegression.test.ts
      - name: Full unit suite
        run: npm run check:unit
      - name: Commit dependency refresh and remove one-time workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-vitest-security-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: update Vitest for security advisory"
          git push origin HEAD:fix/mobile-result-snake-hint-v2
