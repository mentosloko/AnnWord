name: Apply F&F release fixes

on:
  push:
    branches: [fnf-release-fixes-2026-07-26]
    paths:
      - 'tmp/fnf-release-patch/run'

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-fnf-release-fixes
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"F&F Release Verification\",\"description\":\"Applying and testing release fixes\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - name: Decode and apply patch
        id: apply_patch
        continue-on-error: true
        run: |
          set +e
          {
            cat tmp/fnf-release-patch/part* > /tmp/fnf-release-patch.tar.gz.b64
            echo "59c1cc482bba42c9aa8fb442311a549fe1377bf57f063f347ada9a0225ac63fe  /tmp/fnf-release-patch.tar.gz.b64" | sha256sum -c -
            base64 -d /tmp/fnf-release-patch.tar.gz.b64 > /tmp/fnf-release-patch.tar.gz
            echo "a0d849f535468224a33d2526c999d791e7f742462dc74eaa48c3b2d65f13da7a  /tmp/fnf-release-patch.tar.gz" | sha256sum -c -
            rm -rf /tmp/fnf_patch
            mkdir -p /tmp/fnf_patch
            tar -xzf /tmp/fnf-release-patch.tar.gz -C /tmp/fnf_patch
            python3 - <<'PY'
          from pathlib import Path

          patch_path = Path('/tmp/fnf_patch/patch.py')
          patch = patch_path.read_text(encoding='utf-8')
          start = patch.index('# Snake automatically evaluates a full chain; the action button advances.')
          end = patch.index('# A completed daily quest launches a random game unless a saved game should continue.')
          patch_path.write_text(patch[:start] + '# Snake is handled by the resilient workflow override.\n\n' + patch[end:], encoding='utf-8')

          target = Path('components/LetterSquareGameV3.tsx')
          lines = target.read_text(encoding='utf-8').splitlines()
          next_lines = []
          for line in lines:
              if line.startswith('  const word = selected.map('):
                  continue
              if line.startswith('  const choose = (cell: Coord) =>'):
                  next_lines.append("  const evaluate = (path: Coord[]) => { if (!round || feedback || path.length !== round.word.word.length) return; const candidate = path.map(coord => round.grid[coord.row]?.[coord.col]?.letter || '').join(''); const correct = candidate === round.word.word; setFeedback(correct ? 'correct' : 'wrong'); setAnswered(value => value + 1); if (correct) setScore(value => value + 1); save(round.word.word, correct ? 'mastered' : 'failed'); setMessage(correct ? 'Верно! Переходите к следующему слову.' : `Ответ: ${round.word.word}`); };")
                  next_lines.append("  const choose = (cell: Coord) => { if (!round || feedback || done) return; const last = selected[selected.length - 1]; if (last && same(last, cell)) { setSelected(value => value.slice(0, -1)); return; } if (selected.some(coord => same(coord, cell))) { setMessage('Эта клетка уже выбрана. Нажмите «Стереть».'); return; } if (last && !side(last, cell)) { setMessage('Можно двигаться только вверх, вниз, влево или вправо.'); return; } if (selected.length >= round.word.word.length) return; const nextSelected = [...selected, cell]; setSelected(nextSelected); if (nextSelected.length === round.word.word.length) window.setTimeout(() => evaluate(nextSelected), 120); };")
                  continue
              if line.startswith('  const check = () =>'):
                  continue
              next_lines.append(line)
          text = '\n'.join(next_lines) + '\n'
          old_button = '} : <button type="button" onClick={check} className="rounded-2xl bg-blue-600 px-4 py-2.5 text-sm font-bold text-white">Проверить</button>}</div>'
          new_button = '} : <div className="flex items-center justify-center rounded-2xl bg-blue-50 px-4 py-2.5 text-sm font-bold text-blue-700">Осталось букв: {Math.max(0, round.word.word.length - selected.length)}</div>}</div>'
          if text.count(old_button) != 1:
              raise SystemExit(f'Snake button match count: {text.count(old_button)}')
          target.write_text(text.replace(old_button, new_button), encoding='utf-8')
          PY
            python3 /tmp/fnf_patch/patch.py
          } > /tmp/fnf-patch.log 2>&1
          STATUS=$?
          cat /tmp/fnf-patch.log
          exit $STATUS

      - name: Commit patch diagnostic
        if: steps.apply_patch.outcome == 'failure'
        run: |
          cp /tmp/fnf-patch.log tmp/fnf-release-patch/diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/fnf-release-patch/diagnostic.txt
          git commit -m "Record F&F patch failure"
          git push

      - name: Stop after patch failure
        if: steps.apply_patch.outcome == 'failure'
        run: exit 1

      - name: Setup Node.js
        if: steps.apply_patch.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.apply_patch.outcome == 'success'
        run: npm install --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        if: steps.apply_patch.outcome == 'success'
        continue-on-error: true
        run: npm run lint 2>&1 | tee /tmp/fnf-typecheck.log

      - name: Unit tests
        id: unit_tests
        if: steps.apply_patch.outcome == 'success' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        run: npm run check:unit 2>&1 | tee /tmp/fnf-unit.log

      - name: Production build
        id: production_build
        if: steps.apply_patch.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.unit_tests.outcome == 'success'
        continue-on-error: true
        run: npm run build 2>&1 | tee /tmp/fnf-build.log

      - name: Commit verification diagnostic
        if: steps.apply_patch.outcome == 'success' && (steps.typecheck.outcome == 'failure' || steps.unit_tests.outcome == 'failure' || steps.production_build.outcome == 'failure')
        run: |
          {
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "unit_tests=${{ steps.unit_tests.outcome }}"
            echo "production_build=${{ steps.production_build.outcome }}"
            echo
            echo "=== TYPECHECK ==="
            tail -n 220 /tmp/fnf-typecheck.log 2>/dev/null || true
            echo
            echo "=== UNIT TESTS ==="
            tail -n 320 /tmp/fnf-unit.log 2>/dev/null || true
            echo
            echo "=== BUILD ==="
            tail -n 220 /tmp/fnf-build.log 2>/dev/null || true
          } > tmp/fnf-release-patch/verification-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/fnf-release-patch/verification-diagnostic.txt
          git commit -m "Record F&F verification failure"
          git push

      - name: Stop after verification failure
        if: steps.apply_patch.outcome == 'success' && (steps.typecheck.outcome == 'failure' || steps.unit_tests.outcome == 'failure' || steps.production_build.outcome == 'failure')
        run: exit 1

      - name: Commit verified changes
        if: steps.apply_patch.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.production_build.outcome == 'success'
        run: |
          rm -rf tmp/fnf-release-patch .github/workflows/apply-fnf-release-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix F&F gameplay and admin analytics"
          git push

      - name: Publish verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            STATE=success
            DESCRIPTION="F&F release fixes verified"
          else
            STATE=failure
            DESCRIPTION="F&F release verification failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"F&F Release Verification\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          test "$STATE" = success
