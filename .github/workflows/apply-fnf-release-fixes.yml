name: Apply F&F release fixes

on:
  push:
    branches: [fnf-release-fixes-2026-07-26]
    paths:
      - 'tmp/fnf-release-patch/run'

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-fnf-release-fixes
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"F&F Release Verification\",\"description\":\"Applying and testing release fixes\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4

      - name: Decode and apply patch
        run: |
          cat tmp/fnf-release-patch/part* > /tmp/fnf-release-patch.tar.gz.b64
          echo "59c1cc482bba42c9aa8fb442311a549fe1377bf57f063f347ada9a0225ac63fe  /tmp/fnf-release-patch.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/fnf-release-patch.tar.gz.b64 > /tmp/fnf-release-patch.tar.gz
          echo "a0d849f535468224a33d2526c999d791e7f742462dc74eaa48c3b2d65f13da7a  /tmp/fnf-release-patch.tar.gz" | sha256sum -c -
          rm -rf /tmp/fnf_patch
          mkdir -p /tmp/fnf_patch
          tar -xzf /tmp/fnf-release-patch.tar.gz -C /tmp/fnf_patch
          python3 /tmp/fnf_patch/patch.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run check:unit

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        run: |
          rm -rf tmp/fnf-release-patch .github/workflows/apply-fnf-release-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix F&F gameplay and admin analytics"
          git push

      - name: Publish verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            STATE=success
            DESCRIPTION="F&F release fixes verified"
          else
            STATE=failure
            DESCRIPTION="F&F release verification failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"F&F Release Verification\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          test "$STATE" = success
