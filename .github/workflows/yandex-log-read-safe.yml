name: Yandex Log Read Safe

on:
  push:
    branches: [agent/yandex-log-audit]
    paths: ['.github/workflows/yandex-log-read-safe.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/yandex-log-read-safe.yml']

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure yc
        env:
          YC_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_KEY" > /tmp/key.json
          yc config profile create log-reader
          yc config set service-account-key /tmp/key.json
          yc config set cloud-id "$YC_CLOUD"
          yc config set folder-id "$YC_FOLDER"

      - name: Correlate request cancellations
        env:
          CONTAINER_ID: ${{ secrets.YC_SERVERLESS_CONTAINER_ID }}
        run: |
          set -euo pipefail
          FROM="$(date -u -d '71 hours ago' +'%Y-%m-%dT%H:%M:%SZ')"
          UNTIL="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          yc logging read --resource-ids="$CONTAINER_ID" --since="$FROM" --until="$UNTIL" --limit=1000 --max-response-size=20MB --format=json --filter='message: "Request cancelled"' > /tmp/cancelled.json
          node - <<'NODE' > /tmp/ids.txt
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/cancelled.json','utf8'));const a=Array.isArray(x)?x:[];
          for(const e of a){const j=e.json_payload||e.jsonPayload||{};if(j.request_id) console.log(j.request_id)}
          NODE
          echo '=== 499 CORRELATION ==='
          count=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            count=$((count+1))
            yc logging read --resource-ids="$CONTAINER_ID" --since="$FROM" --until="$UNTIL" --limit=100 --max-response-size=2MB --format=json --filter="request_id = \"$id\"" > /tmp/one.json
            N="$count" node <<'NODE'
          const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/one.json','utf8'));const a=Array.isArray(rows)?rows:[];
          const p=e=>e.json_payload||e.jsonPayload||{};const n=process.env.N;
          const http=a.filter(e=>p(e).event==='http_request').map(e=>({at:e.timestamp,method:p(e).method,path:p(e).path,status:p(e).status,durationMs:p(e).duration_ms,aborted:p(e).aborted}));
          const reports=a.filter(e=>/REPORT RequestID/.test(String(e.message||''))).map(e=>{const m=String(e.message||'');return {at:e.timestamp,durationMs:Number(m.match(/Duration:\s*([0-9.]+)/)?.[1]||0),initMs:Number(m.match(/Function Init Duration:\s*([0-9.]+)/)?.[1]||0),queueMs:Number(m.match(/Queuing Duration:\s*([0-9.]+)/)?.[1]||0)}});
          const db=a.filter(e=>/db_pool_wait_slow|db_query_slow|db_transaction_slow|db_connection_retry|PostgreSQL idle client error/i.test(String(e.message||''))).map(e=>String(e.message||'').replace(/\b[0-9a-f]{8}-[0-9a-f-]{27,}\b/gi,'<id>').slice(0,260));
          console.log(JSON.stringify({n:Number(n),http,reports,dbSignals:db},null,0));
          NODE
          done < /tmp/ids.txt
          echo "Correlated $count cancellations"
          rm -f /tmp/key.json /tmp/cancelled.json /tmp/ids.txt /tmp/one.json
