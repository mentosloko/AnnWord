# Production runtime is Yandex Cloud only. Do not add Vercel or Supabase runtime dependencies here.
name: Deploy to Yandex Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/production-operations.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: yandex-cloud-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  YC_BACKEND_IMAGE: annword-api
  AWS_DEFAULT_REGION: ru-central1
  AUTH_FROM_EMAIL: noreply@annword.ru
  YC_CDN_RESOURCE_ID: bc8rtn34qpens6hppppp

jobs:
  build-and-deploy:
    name: Yandex Production
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Mark Yandex production deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({state:"pending",context:"Yandex Production",description:"Deploying commit to Yandex Cloud",target_url:process.env.TARGET_URL}))' > /tmp/yandex-status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/yandex-status.json

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Yandex deploy env smoke check
        env:
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          YC_SERVERLESS_CONTAINER_ID: ${{ secrets.YC_SERVERLESS_CONTAINER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_FRONTEND_BUCKET: ${{ secrets.S3_FRONTEND_BUCKET }}
          S3_ASSETS_BUCKET: ${{ secrets.S3_ASSETS_BUCKET }}
          APP_URL: ${{ secrets.APP_URL }}
          API_URL: ${{ secrets.API_URL }}
          YC_API_PUBLIC_URL: ${{ secrets.YC_API_PUBLIC_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          PRODAMUS_SECRET: ${{ secrets.PRODAMUS_SECRET }}
          PRODAMUS_DEMO_MODE: ${{ secrets.PRODAMUS_DEMO_MODE }}
          PRODAMUS_PAYFORM_HOST: ${{ secrets.PRODAMUS_PAYFORM_HOST }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
        run: npm run api:check

      - name: Run Yandex PostgreSQL migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:yandex:migrate

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.YC_API_PUBLIC_URL }}
        run: |
          npm run build
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/release.json
          node scripts/static-compression-audit.mjs | tee /tmp/static-compression-report.log

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > yc-sa-key.json
          yc config profile create annword-deploy
          yc config set service-account-key yc-sa-key.json
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Verify noreply sender in Yandex Postbox
        run: |
          set -euo pipefail
          IAM_TOKEN="$(yc iam create-token)"
          cat > /tmp/postbox-probe.json <<JSON
          {
            "FromEmailAddress": "${AUTH_FROM_EMAIL}",
            "Destination": { "ToAddresses": ["success@simulator.pstbx.ru"] },
            "Content": {
              "Simple": {
                "Subject": { "Data": "AnnWord deployment sender probe", "Charset": "UTF-8" },
                "Body": { "Text": { "Data": "Verify ${AUTH_FROM_EMAIL} before production deployment.", "Charset": "UTF-8" } }
              }
            }
          }
          JSON
          HTTP_CODE="$(curl -sS -o /tmp/postbox-probe-response.json -w '%{http_code}' \
            -X POST 'https://postbox.cloud.yandex.net/v2/email/outbound-emails' \
            -H 'Content-Type: application/json' \
            -H "X-YaCloud-SubjectToken: ${IAM_TOKEN}" \
            --data-binary @/tmp/postbox-probe.json)"
          cat /tmp/postbox-probe-response.json
          test "$HTTP_CODE" = "200"
          grep -Eqi 'MessageId|messageId' /tmp/postbox-probe-response.json

      - name: Login to Yandex Container Registry
        run: yc container registry configure-docker --hostname cr.yandex --force

      - name: Build and push backend image
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/${YC_BACKEND_IMAGE}:${GITHUB_SHA}"
          docker build -f Dockerfile.api -t "$IMAGE" .
          docker push "$IMAGE"
          echo "BACKEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy backend serverless container revision
        env:
          YC_SERVERLESS_CONTAINER_ID: ${{ secrets.YC_SERVERLESS_CONTAINER_ID }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          PRODAMUS_SECRET: ${{ secrets.PRODAMUS_SECRET }}
          PRODAMUS_DEMO_MODE: ${{ secrets.PRODAMUS_DEMO_MODE }}
          PRODAMUS_PAYFORM_HOST: ${{ secrets.PRODAMUS_PAYFORM_HOST }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_FRONTEND_BUCKET: ${{ secrets.S3_FRONTEND_BUCKET }}
          S3_ASSETS_BUCKET: ${{ secrets.S3_ASSETS_BUCKET }}
          APP_URL: ${{ secrets.APP_URL }}
          API_URL: ${{ secrets.API_URL }}
          YC_API_PUBLIC_URL: ${{ secrets.YC_API_PUBLIC_URL }}
          WEEKLY_REPORT_FROM_EMAIL: ${{ secrets.WEEKLY_REPORT_FROM_EMAIL }}
          WEEKLY_REPORT_CRON_SECRET: ${{ secrets.WEEKLY_REPORT_CRON_SECRET }}
        run: |
          yc serverless container revision deploy \
            --container-id "$YC_SERVERLESS_CONTAINER_ID" \
            --image "$BACKEND_IMAGE" \
            --service-account-id "$YC_SERVICE_ACCOUNT_ID" \
            --cores 1 \
            --memory 512M \
            --execution-timeout 30s \
            --concurrency 8 \
            --min-instances 1 \
            --environment NODE_ENV=production \
            --environment PORT=8080 \
            --environment DATABASE_URL="$DATABASE_URL" \
            --environment PGPOOL_MAX=8 \
            --environment PGPOOL_CONNECTION_TIMEOUT_MS=3000 \
            --environment DB_SLOW_QUERY_MS=300 \
            --environment DB_SLOW_POOL_WAIT_MS=100 \
            --environment AUTH_USER_CACHE_TTL_MS=120000 \
            --environment SESSION_SECRET="$SESSION_SECRET" \
            --environment JWT_SECRET="$JWT_SECRET" \
            --environment COOKIE_SECRET="$COOKIE_SECRET" \
            --environment PRODAMUS_SECRET="$PRODAMUS_SECRET" \
            --environment PRODAMUS_DEMO_MODE="${PRODAMUS_DEMO_MODE:-0}" \
            --environment PRODAMUS_PAYFORM_HOST="${PRODAMUS_PAYFORM_HOST:-manto-school.payform.ru}" \
            --environment YANDEX_CLIENT_ID="$YANDEX_CLIENT_ID" \
            --environment YANDEX_CLIENT_SECRET="$YANDEX_CLIENT_SECRET" \
            --environment S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            --environment S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            --environment S3_ENDPOINT="$S3_ENDPOINT" \
            --environment S3_FRONTEND_BUCKET="$S3_FRONTEND_BUCKET" \
            --environment S3_ASSETS_BUCKET="$S3_ASSETS_BUCKET" \
            --environment APP_URL="$APP_URL" \
            --environment API_URL="$API_URL" \
            --environment YC_API_PUBLIC_URL="$YC_API_PUBLIC_URL" \
            --environment AUTH_FROM_EMAIL="$AUTH_FROM_EMAIL" \
            --environment WEEKLY_REPORT_FROM_EMAIL="$WEEKLY_REPORT_FROM_EMAIL" \
            --environment WEEKLY_REPORT_CRON_SECRET="$WEEKLY_REPORT_CRON_SECRET" \
            --environment RELEASE_SHA="$GITHUB_SHA"

      - name: Verify prepared production revision
        env:
          YC_SERVERLESS_CONTAINER_ID: ${{ secrets.YC_SERVERLESS_CONTAINER_ID }}
        run: |
          set -euo pipefail
          yc serverless container revision list --container-id "$YC_SERVERLESS_CONTAINER_ID" --limit 1 --format json > /tmp/production-revision.json
          cat /tmp/production-revision.json
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/production-revision.json', 'utf8'));
          const revision = Array.isArray(rows) ? rows[0] : rows;
          const min = Number(revision?.provision_policy?.min_instances ?? revision?.provisionPolicy?.minInstances ?? 0);
          const network = revision?.connectivity?.network_id ?? revision?.connectivity?.networkId ?? '';
          if (min !== 1) throw new Error(`Expected min_instances=1, got ${min}`);
          if (!network) throw new Error('Expected private network attachment on production revision');
          console.log(`prepared_instance_verified=true network_id=${network}`);
          NODE

      - name: Install AWS CLI for Object Storage upload
        run: python -m pip install --user --upgrade awscli

      - name: Upload frontend to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_FRONTEND_BUCKET: ${{ secrets.S3_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          python -m awscli --endpoint-url "$S3_ENDPOINT" s3 sync dist "s3://${S3_FRONTEND_BUCKET}" --delete --exclude ".well-known/acme-challenge/*"

          # Every generated HTML entry point must revalidate so route fallbacks never reference deleted bundles.
          while IFS= read -r file; do
            rel="${file#dist/}"
            python -m awscli --endpoint-url "$S3_ENDPOINT" s3 cp "$file" "s3://${S3_FRONTEND_BUCKET}/${rel}" \
              --content-type 'text/html; charset=utf-8' \
              --cache-control 'public,max-age=0,must-revalidate'
          done < <(find dist -type f -name '*.html' -print | sort)

          python -m awscli --endpoint-url "$S3_ENDPOINT" s3 cp dist/release.json "s3://${S3_FRONTEND_BUCKET}/release.json" \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-store'

          # Content-hashed bundles are content-addressed and safe to cache for one year.
          while IFS= read -r file; do
            rel="${file#dist/}"
            base="$(basename "$file")"
            if [[ "$base" =~ -[A-Za-z0-9_-]{8,}\.(js|css|json|svg|woff2?)$ ]]; then
              python -m awscli --endpoint-url "$S3_ENDPOINT" s3 cp "$file" "s3://${S3_FRONTEND_BUCKET}/${rel}" \
                --cache-control 'public,max-age=31536000,immutable'
            fi
          done < <(find dist/assets -type f -print | sort)

      # HTML is cached by CDN independently of Object Storage. Clear stale route
      # variants so visitors immediately receive the new content-hashed bundles.
      - name: Purge Yandex CDN after frontend upload
        run: |
          set -euo pipefail
          yc cdn cache purge --resource-id "$YC_CDN_RESOURCE_ID" --all

      - name: Verify live Yandex production
        env:
          APP_URL: ${{ secrets.APP_URL }}
          YC_API_PUBLIC_URL: ${{ secrets.YC_API_PUBLIC_URL }}
        run: |
          set -euo pipefail
          APP_BASE="${APP_URL%/}"
          API_BASE="${YC_API_PUBLIC_URL%/}"

          for attempt in $(seq 1 30); do
            RELEASE_BODY="$(curl -fsS "${APP_BASE}/release.json?sha=${GITHUB_SHA}" || true)"
            HEALTH_BODY="$(curl -fsS "${API_BASE}/api/health" || true)"
            DB_HEALTH_BODY="$(curl -fsS "${API_BASE}/api/health/db" || true)"
            if printf '%s' "$RELEASE_BODY" | grep -Fq "$GITHUB_SHA" \
              && printf '%s' "$HEALTH_BODY" | grep -Eqi 'ok|healthy' \
              && printf '%s' "$DB_HEALTH_BODY" | grep -Eqi 'ok|healthy'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production did not expose release $GITHUB_SHA or healthy API/database in time."
              echo "release.json: $RELEASE_BODY"
              echo "health: $HEALTH_BODY"
              echo "health/db: $DB_HEALTH_BODY"
              exit 1
            fi
            sleep 10
          done

          PREFLIGHT_HEADERS="$(curl -sSI -X OPTIONS \
            -H 'Origin: https://annword.ru' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,x-annword-session' \
            "${API_BASE}/api/profile/coins" | tr -d '\r')"
          printf '%s\n' "$PREFLIGHT_HEADERS"
          printf '%s\n' "$PREFLIGHT_HEADERS" | grep -Eq '^HTTP/[^ ]+ 204 '
          printf '%s\n' "$PREFLIGHT_HEADERS" | grep -Eqi '^access-control-max-age:[[:space:]]*3600([[:space:]]|$)'
          printf '%s\n' "$PREFLIGHT_HEADERS" | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://annword\.ru([[:space:]]|$)'
          printf '%s\n' "$PREFLIGHT_HEADERS" | grep -Eqi '^access-control-allow-credentials:[[:space:]]*true([[:space:]]|$)'

          FOREIGN_PREFLIGHT_HEADERS="$(curl -sSI -X OPTIONS \
            -H 'Origin: https://untrusted.example' \
            -H 'Access-Control-Request-Method: POST' \
            "${API_BASE}/api/profile/coins" | tr -d '\r')"
          printf '%s\n' "$FOREIGN_PREFLIGHT_HEADERS"
          FOREIGN_ALLOW_ORIGIN="$(printf '%s\n' "$FOREIGN_PREFLIGHT_HEADERS" | sed -n 's/^access-control-allow-origin:[[:space:]]*//Ip' | head -n 1)"
          if [ "$FOREIGN_ALLOW_ORIGIN" = '*' ] || [ "$FOREIGN_ALLOW_ORIGIN" = 'https://untrusted.example' ]; then
            echo "API Gateway exposed a wildcard or reflected an untrusted CORS origin."
            exit 1
          fi
          if [ -n "$FOREIGN_ALLOW_ORIGIN" ] && [ "$FOREIGN_ALLOW_ORIGIN" != 'https://annword.ru' ]; then
            echo "API Gateway returned an unexpected CORS origin: $FOREIGN_ALLOW_ORIGIN"
            exit 1
          fi

          TEST_EMAIL="deploy-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@gmail.com"
          HTTP_CODE="$(curl -sS -o /tmp/foreign-email-response.json -w '%{http_code}' \
            -X POST "${API_BASE}/api/auth/email/account" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"${TEST_EMAIL}\",\"credential\":\"DeployProbe123!\",\"name\":\"Deploy Probe\"}")"
          cat /tmp/foreign-email-response.json
          test "$HTTP_CODE" = "400"
          grep -Fq 'russian_email_domain_required' /tmp/foreign-email-response.json

          KIDS_REDIRECT_HEADERS="$(curl -sSI "${APP_BASE}/kids" | tr -d '\r')"
          printf '%s\n' "$KIDS_REDIRECT_HEADERS"
          printf '%s\n' "$KIDS_REDIRECT_HEADERS" | grep -Eq '^HTTP/[^ ]+ 30[1278] '
          printf '%s\n' "$KIDS_REDIRECT_HEADERS" | grep -Eqi '^location:[[:space:]]*/kids/[[:space:]]*$'

          for route in / /kids/; do
            HTML_HEADERS="$(curl -fsSI "${APP_BASE}${route}" | tr -d '\r')"
            printf '%s\n' "$HTML_HEADERS"
            printf '%s\n' "$HTML_HEADERS" | grep -Eqi '^cache-control:.*(max-age=0|no-cache|must-revalidate)'
          done

          INDEX_BODY="$(curl -fsS "${APP_BASE}/")"
          HASHED_ASSET="$(printf '%s' "$INDEX_BODY" | grep -Eo '/assets/[^"'"'"' ]+-[A-Za-z0-9_-]{8,}\.(js|css)' | head -n 1)"
          test -n "$HASHED_ASSET"
          ASSET_HEADERS="$(curl -fsSI "${APP_BASE}${HASHED_ASSET}" | tr -d '\r')"
          printf '%s\n' "$ASSET_HEADERS"
          printf '%s\n' "$ASSET_HEADERS" | grep -Eqi '^cache-control:.*max-age=31536000.*immutable'

          ENCODING_HEADERS="$(curl -fsSI -H 'Accept-Encoding: br, gzip' "${APP_BASE}${HASHED_ASSET}" | tr -d '\r')"
          CONTENT_ENCODING="$(printf '%s\n' "$ENCODING_HEADERS" | sed -n 's/^content-encoding:[[:space:]]*//Ip' | head -n 1)"
          echo "Production static encoding for ${HASHED_ASSET}: ${CONTENT_ENCODING:-identity}"

      - name: Deployment summary
        run: |
          echo "Production commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend image: $BACKEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend bucket: ${{ secrets.S3_FRONTEND_BUCKET }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Postbox sender: $AUTH_FROM_EMAIL (verified with delivery simulator)" >> "$GITHUB_STEP_SUMMARY"
          echo "Prepared API instance: min_instances=1 with private network attachment verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Live API/database health and CORS preflight: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Live API foreign-email rejection: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Static delivery cache policy: verified for root and route HTML plus hashed assets" >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 /tmp/static-compression-report.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish Yandex production commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Yandex production deployed and verified"
          else
            STATE="failure"
            DESCRIPTION="Yandex production deployment or verification failed"
          fi
          export STATE DESCRIPTION
          node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"Yandex Production",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))' > /tmp/yandex-status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/yandex-status.json