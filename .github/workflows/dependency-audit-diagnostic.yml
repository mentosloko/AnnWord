name: Dependency Audit Diagnostic

on:
  push:
    branches:
      - chore/dependency-audit

permissions:
  contents: write

jobs:
  audit:
    name: npm audit details
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only

      - name: Verify clean install and audit
        shell: bash
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh vulnerable transitive dependencies"
          git push
