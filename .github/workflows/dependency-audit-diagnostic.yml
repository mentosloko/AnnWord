name: Dependency Audit Diagnostic

on:
  push:
    branches:
      - chore/dependency-audit

jobs:
  audit:
    name: npm audit details
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Show npm audit report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          code=$?
          cat npm-audit.json
          exit "$code"
